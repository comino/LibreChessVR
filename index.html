<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessVR — Lichess</title>
<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #1b2028; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10; width: 250px;
    background: rgba(15,18,24,.88); color: #c8ccd4; border-radius: 10px;
    padding: 12px 14px; font-size: 14px;
  }
  #ui h1 { font-size: 16px; margin: 0 0 8px; color: #e8e2d0; }
  #ui input, #ui select, #ui button {
    font: inherit; background: #2a3038; color: #e0e4ea; border: 1px solid #444c58;
    border-radius: 6px; padding: 5px 8px; margin: 2px 0; box-sizing: border-box;
  }
  #ui input[type=text], #ui input[type=password] { width: 100%; }
  #ui input[type=number] { width: 52px; }
  #ui button { cursor: pointer; }
  #ui button:hover { background: #3a4250; }
  #msg { margin-top: 8px; color: #e8d44a; min-height: 18px; }
  .row { margin: 6px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  a { color: #7aa2d4; }
  small { color: #8899aa; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="ui">
  <h1>ChessVR</h1>
  <div id="auth">
    <input id="token" type="password" placeholder="lichess API token">
    <div class="row">
      <button id="connect">Connect</button>
      <small><a href="https://lichess.org/account/oauth/token/create?scopes[]=board:play&scopes[]=challenge:write&description=ChessVR" target="_blank">create token</a></small>
    </div>
  </div>
  <div id="play" style="display:none">
    <div class="row">
      <input id="time" type="number" value="10" min="3"> +
      <input id="inc" type="number" value="5" min="0">
      <select id="color"><option value="random">random</option><option value="white">white</option><option value="black">black</option></select>
    </div>
    <div class="row">
      <button id="seek">Seek human</button>
      <label><input id="rated" type="checkbox"> rated</label>
    </div>
    <div class="row">
      <button id="ai">Play Stockfish</button>
      lvl <input id="ailevel" type="number" value="3" min="1" max="8">
      <button id="resign">Resign</button>
    </div>
    <div class="row">
      <button id="maiaBtn">Play Maia</button>
      <select id="maia"><option value="1">maia1</option><option value="5" selected>maia5</option><option value="9">maia9</option></select>
    </div>
  </div>
  <div class="row">
    hands <select id="handmode">
      <option value="ray" selected>point &amp; pinch</option>
      <option value="grab">grab pieces</option>
    </select>
  </div>
  <div class="row">
    <button id="puzzle">Puzzles</button>
    <select id="pdiff">
      <option value="easiest">easiest</option>
      <option value="easier">easier</option>
      <option value="normal" selected>normal</option>
      <option value="harder">harder</option>
      <option value="hardest">hardest</option>
    </select>
    <select id="ptheme">
      <option value="mix">mixed</option><option value="mateIn1">mate in 1</option><option value="mateIn2">mate in 2</option>
      <option value="mateIn3">mate in 3</option><option value="fork">forks</option><option value="pin">pins</option>
      <option value="skewer">skewers</option><option value="endgame">endgames</option><option value="opening">openings</option>
    </select>
    <button id="coords">Coordinates</button>
    <button id="rush">Puzzle rush</button>
  </div>
  <div id="msg">Loading…</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
