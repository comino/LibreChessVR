<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Parallax game smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
import { TINT } from './src/theme.js'
import * as THREE from 'three'
import { Board3D } from './src/board3d.js'
import { GameSession } from './src/game.js'
const out = document.getElementById('result')
const sleep = ms => new Promise(r => setTimeout(r, ms))
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }

// Fake lichess: a stream we push messages into, API calls recorded.
const calls = []
let push, reject = null
const lichess = {
  streamGame: (id, onMsg, signal) => new Promise((_, rej) => {
    push = onMsg
    signal.addEventListener('abort', () => rej(Object.assign(new Error('aborted'), { name: 'AbortError' })))
  }),
  move: async (id, uci) => { calls.push('move ' + uci); if (reject) throw new Error(reject) },
  draw: async (id, yes) => calls.push('draw ' + yes),
  takeback: async (id, yes) => calls.push('takeback ' + yes),
  abort: async () => calls.push('abort'),
  resign: async () => calls.push('resign'),
  challengeAi: async p => calls.push('ai ' + JSON.stringify(p)),
  challenge: async (user, p) => calls.push('challenge ' + user + ' ' + JSON.stringify(p)),
  claimVictory: async () => calls.push('claim')
}
const full = (moves, initialFen = 'startpos', black = { aiLevel: 3 }) => ({
  type: 'gameFull', initialFen, white: { id: 'Me', name: 'Me' }, black, rated: true,
  clock: { initial: 600000, increment: 5000 },
  state: { type: 'gameState', moves, wtime: 600000, btime: 600000, status: 'started' }
})
const state = (moves, extra = {}) => ({ type: 'gameState', moves, wtime: 590000, btime: 590000, status: 'started', ...extra })

try {
  const board = new Board3D()
  await board.init()
  let text = ''
  const game = new GameSession({ lichess, board, username: 'me', gameId: 'g1', onStatus: t => { text = t } })
  const done = game.start()
  await sleep(0)
  const labels = () => board.bar.mesh.visible ? board.bar.buttons.map(b => b.label).join() : ''
  const press = label => {
    const i = board.bar.buttons.findIndex(b => b.label === label)
    check(i >= 0, 'button present: ' + label + ' in ' + labels())
    board.bar.press((i % 3 + 0.5) / 3, 1 - (Math.floor(i / 3) + 0.5) / 3)
  }

  check(!board.canPick('e2'), 'nothing pickable before gameFull')
  push(full(''))
  check(game.color === 'white' && text === 'Your move', 'white to move, got ' + text)
  check(labels() === 'Offer draw,Flip board,Abort', 'opening buttons: ' + labels())
  check(board.canPick('e2') && !board.canPick('e7'), 'canPick own pieces')

  const spoken = []
  Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: { cancel() {}, speak: u => spoken.push(u.text) } })
  board.voice = 'opponent'
  board.onMove('e2', 'e4')
  check(calls.at(-1) === 'move e2e4' && game.applied === 1, 'optimistic move sent')
  push(state('e2e4'))                                  // echo: no-op
  check(game.chess.history().length === 1, 'echo not re-applied')
  push(state('e2e4 e7e5'))
  check(spoken.join('|') === 'Pawn E 5', 'only the opponent move spoken: ' + spoken)
  board.voice = 'off'
  check(labels() === 'Offer draw,Flip board,Resign', 'resign after both moved: ' + labels())
  press('Flip board')
  check(Math.abs(board.boardGroup.rotation.y - Math.PI) < 1e-9, 'white game viewed from black side')
  check(board.canPick('e2') === false && board.canPick('g1'), 'moves unaffected by the flip')
  press('Flip board')
  check(board.boardGroup.rotation.y === 0, 'flip back')
  press('Flip board')
  check(!board.flipped, 'in-game flip is a temporary peek, not the setting')
  board.setPieceStyle('hidden'); game.render()
  check(labels() === 'Offer draw,Flip board,Show pieces,Resign', 'show pieces offered when hidden: ' + labels())
  board.setPieceStyle('solid'); game.render()
  const ts0 = board.panel.status.ts
  await sleep(30); game.render()
  check(board.panel.status.ts === ts0, 're-render keeps the server snapshot time (no clock jump)')

  // Stale state (sent before our optimistic move arrived) must not undo it
  board.onMove('g1', 'f3')
  let resets = 0
  const realSet = board.setPosition.bind(board)
  board.setPosition = (...a) => { resets++; realSet(...a) }
  push(state('e2e4 e7e5', { bdraw: true }))
  check(game.chess.history().join() === 'e4,e5,Nf3' && resets === 0, 'stale state ignored: ' + game.chess.history())
  check(text === 'Draw offered to you', 'but its offer is shown')
  push(state('e2e4 e7e5 g1f3'))                         // echo
  check(game.chess.history().length === 3 && resets === 0, 'echo no-op')
  board.setPosition = realSet
  // real takeback of our move by the server: list shrinks below the server's previous count
  push(state('e2e4 e7e5'))
  check(game.chess.history().join() === 'e4,e5' && game.applied === 2, 'server takeback undoes Nf3')

  press('Resign')
  check(!calls.includes('resign'), 'resign needs confirmation')
  press('Resign'); await sleep(0)
  check(calls.at(-1) === 'resign', 'resign confirmed')

  reject = 'Not your turn'
  board.onMove('g1', 'f3'); await sleep(0)
  reject = null
  check(game.chess.history().length === 2 && game.applied === 2, 'rejected move rolled back')
  check(text === 'Move rejected: Not your turn', 'rejection shown, got ' + text)
  check(board.panel.status.text === text, 'rejection shown in VR panel')

  push(state('e2e4 e7e5', { bdraw: true }))
  check(text === 'Draw offered to you', 'draw offer visible, got ' + text)
  check(labels() === 'Accept draw,Decline draw,Flip board,Resign', 'draw buttons: ' + labels())
  press('Accept draw'); await sleep(0)
  check(calls.at(-1) === 'draw true', 'draw accepted')
  push(state('e2e4 e7e5', { wdraw: true }))
  check(text === 'You offered a draw' && labels() === 'Flip board,Resign', 'own offer: ' + text + ' / ' + labels())

  // Opponent takeback: moves list shrinks -> state rebuilt from scratch
  board.onMove('g1', 'f3')
  push(state('e2e4 e7e5 g1f3 b8c6', { btakeback: true }))
  check(labels().includes('Accept takeback'), 'takeback buttons: ' + labels())
  press('Accept takeback'); await sleep(0)
  check(calls.at(-1) === 'takeback true', 'takeback accepted')
  push(state('e2e4 e7e5 g1f3'))
  check(game.chess.history().join() === 'e4,e5,Nf3' && game.applied === 3, 'rebuilt after takeback: ' + game.chess.history())
  check(board.pieceAt.f3?.userData.type === 'n' && !board.pieceAt.c6 && board.pieceAt.b8, 'board rebuilt after takeback')
  check(game.chess.turn() === 'b' && text === 'Nf3 · Waiting…', 'black to move after takeback, got ' + text)

  // Promotion through the board picker (reconnect into a new position)
  push(full('', '8/4P3/8/8/8/8/k7/4K3 w - - 0 1'))
  check(board.boardGroup.rotation.y === 0, 'peek cleared when the board is re-oriented')
  const before = calls.length
  board._select('e7'); board._select('e8')
  check(board.picker && calls.length === before, 'picker opened, no move yet')
  board._tick()                                   // render a frame: world matrices
  const slot = board.picker.group.children[3]   // q r b n
  const p = slot.getWorldPosition(new THREE.Vector3())
  board.raycaster.set(p.clone().add(new THREE.Vector3(0, 0.3, 0)), new THREE.Vector3(0, -1, 0))
  board._pick()
  check(calls.at(-1) === 'move e7e8n', 'knight underpromotion sent, got ' + calls.at(-1))
  check(game.chess.get('e8')?.type === 'n' && !board.picker, 'knight on e8, picker closed')

  push(state('e7e8n', { status: 'mate', winner: 'white' }))
  check(text === 'Checkmate — you win', 'result text, got ' + text)
  check(labels() === 'Rematch,Review game' && !board.canPick('e8'), 'finished: rematch + review, got ' + labels())
  press('Rematch'); await sleep(0)
  check(calls.at(-1) === 'ai {"level":3,"time":10,"increment":5,"color":"black"}', 'AI rematch, colors swapped: ' + calls.at(-1))
  check(text === 'Starting rematch…', 'rematch feedback, got ' + text)
  const nCalls = calls.length
  check(!labels().includes('Rematch'), 'Rematch gone after use: ' + labels())
  game._rematch()                                          // e.g. a double trigger
  check(calls.length === nCalls, 'second rematch ignored')
  push(state('e7e8n', { status: 'resign', winner: 'black' }))
  check(text === 'Resignation — you lose', 'loss text, got ' + text)

  game.stop()
  await done

  // --- robustness: one fresh session per scenario ---
  const menu = () => [{ label: 'Menu', run() {} }]
  const fresh = async () => {
    const g = new GameSession({ lichess, board, username: 'me', gameId: 'g2', onStatus: t => { text = t }, menu })
    const d = g.start()
    await sleep(0)
    return [g, d]
  }
  const ends = (d, what) => Promise.race([d, sleep(3000).then(() => { throw new Error('stream loop still running: ' + what) })])

  // Castling sent king-takes-rook (e1h1) is understood; the game continues after it
  let [g, d] = await fresh()
  push(full('e2e4 e7e5 g1f3 b8c6 f1c4 g8f6 e1h1'))
  check(g.chess.get('g1')?.type === 'k' && g.chess.get('f1')?.type === 'r', 'e1h1 castled short')
  push(state('e2e4 e7e5 g1f3 b8c6 f1c4 g8f6 e1h1 f8c5'))
  check(g.applied === 8 && g.chess.get('c5')?.type === 'b', 'moves after castling applied')

  // A move we can't apply stops the session with a visible error (no reconnect loop)
  push(state('e2e4 e7e5 g1f3 b8c6 f1c4 g8f6 e1h1 f8c5 a1a8'))
  await ends(d, 'sync error')
  check(text.startsWith('Sync error') && board.panel.status.text === text, 'sync error shown, got ' + text)
  check(labels() === 'Menu' && !board.canPick('d2'), 'menu offered, board locked')

  // Unsupported variant: refused up front
  ;[g, d] = await fresh()
  push({ ...full(''), variant: { key: 'crazyhouse' } })
  await ends(d, 'variant')
  check(text === "Variant crazyhouse isn't supported — play it on lichess", 'variant refused, got ' + text)
  check(labels() === 'Menu', 'menu after variant refusal')

  // Chess960-free "fromPosition" is fine
  ;[g, d] = await fresh()
  push({ ...full('', '4k3/8/8/8/8/8/8/4K2R w K - 0 1'), variant: { key: 'fromPosition' } })
  check(!g.finished && board.canPick('h1'), 'fromPosition playable')

  // Opponent leaves: countdown, then a Claim win button; coming back clears it
  push(state('e1g1 e8d8'))
  push({ type: 'opponentGone', gone: true, claimWinInSeconds: 2 })
  check(text === 'Opponent left — claim in 2 s' && !labels().includes('Claim win'), 'countdown, got ' + text)
  await sleep(1100)
  check(text === 'Opponent left — claim in 1 s', 'countdown ticks, got ' + text)
  await sleep(1100)
  check(text === 'Opponent left — claim the win' && labels().startsWith('Claim win'), 'claimable: ' + labels())
  press('Claim win'); await sleep(0)
  check(calls.at(-1) === 'claim', 'claim sent')
  push({ type: 'opponentGone', gone: false })
  check(text === 'Kd8 · Your move' && !labels().includes('Claim win'), 'opponent back, got ' + text)
  g.stop()
  await d

  // Rematch against a human: direct challenge, same clock and rated flag, colors swapped
  ;[g, d] = await fresh()
  push(full('', 'startpos', { id: 'bob', name: 'Bob' }))
  push(state('', { status: 'aborted' }))
  press('Rematch'); await sleep(0)
  check(calls.at(-1) === 'challenge bob {"time":10,"increment":5,"color":"black","rated":true}', 'human rematch: ' + calls.at(-1))
  check(text === 'Rematch offered to Bob…', 'offer text, got ' + text)
  check(labels() === 'Menu', 'menu kept, rematch used up, got ' + labels())
  g.stop(); await d

  // Premoves: queued during the opponent's turn, played on their move if still legal
  ;[g, d] = await fresh()
  push(full(''))
  board.onMove('e2', 'e4')                              // black to move now
  check(board.canPick('g1') && board.getTargets('g1').includes('f3'), 'own pieces pickable on their turn')
  let n0 = calls.length
  board.onMove('g1', 'f3')
  check(calls.length === n0 && text === 'Premove Nf3' && board.marks.g1 && board.marks.f3, 'premove queued: ' + text)
  check(labels().includes('Cancel premove'), 'cancel offered')
  push(state('e2e4 e7e5'))
  check(calls.at(-1) === 'move g1f3' && g.chess.history().at(-1) === 'Nf3' && !g.premove && !board.marks.g1, 'premove played')
  board.onMove('b1', 'c3'); press('Cancel premove')
  check(!g.premove && !board.marks.b1, 'manual cancel')
  n0 = calls.length
  push(state('e2e4 e7e5 g1f3 b8c6'))
  check(calls.length === n0, 'cancelled premove not played')
  g.stop(); await d

  // Premove made illegal by a check is dropped with a message
  ;[g, d] = await fresh()
  push(full('', '4k2r/8/8/8/8/8/8/R3K3 w - - 0 1'))
  board.onMove('a1', 'a2')                              // black to move
  board.onMove('a2', 'a8')                              // premove Ra8+
  check(text === 'Premove Ra8+', 'premove shown: ' + text)
  n0 = calls.length
  push(state('a1a2 h8h1'))                              // check! Ra8 no longer legal
  check(calls.length === n0 && text === 'Premove cancelled' && !board.marks.a2, 'illegal premove dropped: ' + text)
  check(board.canPick('e1') && g.chess.turn() === 'w', 'we still have to answer the check')
  g.stop(); await d

  // Anonymous opponent: no rematch possible
  ;[g, d] = await fresh()
  push(full('', 'startpos', { name: 'Anonymous' }))
  push(state('', { status: 'aborted' }))
  check(labels() === 'Menu', 'no rematch vs anonymous: ' + labels())
  g.stop(); await d

  // Post-game replay: steps, clamps, check tint follows the shown position
  ;[g, d] = await fresh()
  push(full(''))
  push(state('e2e4 e7e5 d1h5 b8c6 f1c4 g8f6 h5f7', { status: 'mate', winner: 'white' }))
  const tintE8 = () => board.tiles.e8.userData.tint
  check(tintE8() === TINT.check, 'mated king red at the end')
  press('Review game')
  check(labels() === 'Prev move,Next move,Flip board,Done', 'review bar: ' + labels())
  press('Prev move')
  check(text === 'Move 6/7: Nf6' && board.pieceAt.h5?.userData.type === 'q' && board.pieceAt.f7?.userData.color === 'b', 'one back: ' + text)
  check(tintE8() === 0, 'no check tint before the mate')
  for (let i = 0; i < 10; i++) press('Prev move')
  check(text === 'Start · 0/7' && board.pieceAt.e2 && !board.pieceAt.e4, 'clamped at start: ' + text)
  press('Next move')
  check(text === 'Move 1/7: e4' && board.pieceAt.e4, 'forward one: ' + text)
  for (let i = 0; i < 10; i++) press('Next move')
  check(text === 'Checkmate — you win' && g.replayIdx == null && tintE8() === TINT.check, 'back at the end: ' + text)
  check(!board.canPick('e2'), 'replay never enables moves')
  press('Prev move'); press('Prev move'); press('Done')
  check(text === 'Checkmate — you win' && labels() === 'Rematch,Review game,Menu' && tintE8() === TINT.check, 'Done returns to the final position: ' + labels())
  g.stop(); await d

  // A move request failing after stop() must not touch the board
  ;[g, d] = await fresh()
  push(full(''))
  let rejectLater
  lichess.move = () => new Promise((_, rej) => { rejectLater = rej })
  board.onMove('e2', 'e4')
  g.stop(); await d
  board.setPosition('8/8/8/8/8/8/8/K6k w - - 0 1')       // another session owns the board now
  rejectLater(new Error('late'))
  await sleep(0)
  check(board.piecesGroup.children.length === 2, 'late rejection ignored after stop')

  out.textContent = 'GAME-OK'
} catch (e) {
  out.textContent = 'GAME-FAIL ' + e.message
}
</script>
</body>
</html>
