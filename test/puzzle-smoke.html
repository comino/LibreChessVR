<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Parallax puzzle smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
import { TINT } from './src/theme.js'
import { Board3D } from './src/board3d.js'
import { PuzzleSession } from './src/puzzle.js'
const out = document.getElementById('result')
const sleep = ms => new Promise(r => setTimeout(r, ms))
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }

// Fixture A: scholar's mate line, solver=white, replies auto-played.
// Fixture B: fool's mate, solver=black, single mating move.
const fixtures = [
  { game: { pgn: 'e4 e5' },
    puzzle: { id: 'testA', rating: 1200, solution: ['f1c4', 'b8c6', 'd1h5', 'g8f6', 'h5f7'] } },
  { game: { pgn: 'f3 e5 g4' },
    puzzle: { id: 'testB', rating: 600, solution: ['d8h4'] } }
]
let fetches = 0
const fetchArgs = []
const lichess = { puzzleNext: async (...a) => { fetchArgs.push(a); return fixtures[fetches++ % 2] } }
localStorage.removeItem('puzzleStats')

try {
  const board = new Board3D()
  await board.init()
  let status = ''
  const puzzles = new PuzzleSession({ lichess, board, onStatus: t => { status = t },
    options: () => ({ difficulty: 'harder', angle: 'mateIn2' }) })

  const spoken = []
  Object.defineProperty(window, 'speechSynthesis', { configurable: true, value: { cancel() {}, speak: u => spoken.push(u.text) } })
  board.voice = 'all'
  await puzzles.next('normal')
  check(spoken.join('|') === 'Pawn E 5', 'setup move spoken: ' + spoken)
  check(status === 'Find the best move for white', 'initial status, got: ' + status)
  check(board.canPick('f1') && !board.canPick('e7'), 'canPick own pieces only')

  check(board.bar.buttons.map(b => b.label).join() === 'Next puzzle,Hint,Flip board', 'puzzle bar: ' + board.bar.buttons.map(b => b.label))
  board.bar.buttons[1].run()                   // Hint: f1 bishop
  check(board.tiles.f1.userData.tint === TINT.hint, 'hint marks f1')
  const fen = puzzles.chess.fen()
  board.onMove('g1', 'f3')                     // legal but wrong
  check(status === 'Not it — try again', 'wrong move detected')
  check(puzzles.chess.fen() === fen, 'wrong move rolled back')

  board.onMove('f1', 'c4'); await sleep(700)   // reply b8c6 auto-plays
  check(board.tiles.f1.userData.tint !== TINT.hint && !board.marks.f1, 'hint cleared after the move')
  check(board.bar.buttons.some(b => b.label === 'Hint'), 'hint offered again on my turn')
  board.bar.buttons.find(b => b.label === 'Hint').run()    // d1 queen
  check(board.marks.d1, 'second hint on d1')
  check(status === 'Your move (white)', 'opponent replied')
  check(spoken.slice(1, 3).join('|') === 'Bishop C 4|Knight C 6', 'own + reply spoken in "all" mode: ' + spoken)
  board.voice = 'off'
  check(puzzles.chess.get('c6')?.type === 'n', 'reply applied on board state')
  board.onMove('d1', 'h5')
  check(!board.bar.buttons.some(b => b.label === 'Hint'), 'no hint while the reply is pending')
  puzzles.hint()
  check(Object.keys(board.marks).length === 0, 'hint() does nothing during the reply')
  await sleep(700)                             // reply g8f6
  board.onMove('h5', 'f7')                     // Qxf7#
  check(status === 'Solved! Next puzzle…', 'puzzle A solved, got: ' + status)

  await sleep(2500)                            // auto-advance to fixture B
  check(status === 'Find the best move for black', 'puzzle B loaded, got: ' + status)
  check(Math.abs(board.boardGroup.rotation.y - Math.PI) < 1e-6, 'board flipped for black')
  board.onMove('d8', 'h4')                     // Qh4#
  check(status === 'Solved! Next puzzle…', 'puzzle B solved')
  check(fetches === 2, 'fetch count')
  check(fetchArgs.every(a => a[0] === 'harder' && a[1] === 'mateIn2'), 'options passed to fetch: ' + JSON.stringify(fetchArgs))
  // A: wrong move + hint -> not clean -> streak stays 0; B: clean -> streak 1
  const stats = JSON.parse(localStorage.getItem('puzzleStats'))
  check(stats.streak === 1 && stats.best === 1 && stats.solved === 2, 'streak after A (dirty) + B (clean): ' + JSON.stringify(stats))
  check(board.panel.status.sub.endsWith('streak 1 (best 1)'), 'streak on panel: ' + board.panel.status.sub)
  check(board.bar.buttons[0]?.label === 'Next puzzle', 'Next puzzle button')

  // A piece selected before stop() cannot be moved afterwards
  const late = new PuzzleSession({ board, onStatus: t => { status = t }, lichess: { puzzleNext: async () => fixtures[1] } })
  await late.next()
  board._select('d8')
  check(board.selected === 'd8', 'selected before stop')
  late.stop()
  check(!board.selected, 'stop clears the selection')
  const fenStopped = late.chess.fen()
  board.onMove('d8', 'h4')
  check(late.chess.fen() === fenStopped, 'stopped puzzle ignores the move')

  // Race: stop() while a fetch is in flight -> the late puzzle must not take the board
  let release
  const slow = new PuzzleSession({ lichess: { puzzleNext: () => new Promise(r => { release = r }) },
    board, onStatus: () => {} })
  const pending = slow.next()
  slow.stop()
  const sentinel = () => 'game'
  board.canPick = sentinel
  release(fixtures[0]); await pending
  check(board.canPick === sentinel && !slow.running, 'stopped puzzle did not hijack the board')

  // Streak grows with clean solves, hint breaks it, best is kept; persists across sessions
  const clean = () => ({ game: { pgn: 'f3 e5 g4' }, puzzle: { id: 'm', rating: 600, solution: ['d8h4'] } })
  const s2 = new PuzzleSession({ board, onStatus: () => {}, lichess: { puzzleNext: async () => clean() } })
  check(s2.stats.streak === 1, 'stats loaded from storage')
  await s2.next(); board.onMove('d8', 'h4'); s2.stop()
  await s2.next(); board.onMove('d8', 'h4'); s2.stop()
  check(s2.stats.streak === 3 && s2.stats.best === 3, 'streak 3: ' + JSON.stringify(s2.stats))
  await s2.next(); s2.hint()
  check(s2.stats.streak === 0 && s2.stats.best === 3, 'hint resets streak, best kept')
  board.onMove('d8', 'h4'); s2.stop()
  check(s2.stats.streak === 0 && s2.stats.solved === 5, 'hinted solve does not count for streak')
  await s2.next(); board.onMove('d8', 'h4'); s2.stop()
  check(s2.stats.streak === 1, 'clean again')
  await s2.next(); await s2.next()                 // skip an unsolved puzzle
  check(s2.stats.streak === 0, 'skipping breaks the streak')
  s2.stop()

  // Underpromotion: queen is wrong, knight solves
  const promo = new PuzzleSession({ board, onStatus: t => { status = t }, lichess: { puzzleNext: async () => ({
    game: { pgn: 'a4 b5 axb5 a6 bxa6 Bb7 axb7 Nc6' }, puzzle: { id: 'testC', rating: 1500, solution: ['b7a8n'] } }) } })
  await promo.next()
  board.onMove('b7', 'a8', 'q')
  check(status === 'Not it — try again' && promo.chess.get('b7')?.type === 'p', 'queen promotion rejected')
  board.onMove('b7', 'a8', 'n')
  check(status === 'Solved! Next puzzle…', 'knight promotion solves, got ' + status)
  check(!board.canPick('a8'), 'no moves after solved')
  promo.stop()

  // Corrupt solution reply: reported and skipped, no exception in the timer
  const bad = new PuzzleSession({ board, onStatus: t => { status = t }, lichess: { puzzleNext: async () => ({
    game: { pgn: 'e4 e5' }, puzzle: { id: 'bad', rating: 1, solution: ['f1c4', 'zzzz', 'd1h5'] } }) } })
  await bad.next()
  board.onMove('f1', 'c4'); await sleep(700)
  check(status === 'Puzzle data error — skipping', 'bad reply handled, got ' + status)
  check(bad.stats.streak === JSON.parse(localStorage.getItem('puzzleStats')).streak && !bad.running, 'data error skip is not a miss')
  bad.stop()

  out.textContent = 'PUZZLE-OK'
} catch (e) {
  out.textContent = 'PUZZLE-FAIL ' + e.message
}
</script>
</body>
</html>
