<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Parallax grab smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
import { TINT } from './src/theme.js'
import * as THREE from 'three'
import { Board3D } from './src/board3d.js'
import { squareToXZ } from './src/coords.js'
const out = document.getElementById('result')
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }
const S = 0.06

try {
  const board = new Board3D()
  await board.init()
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  board.canPick = sq => sq[1] === '1' || sq[1] === '2'  // white to move
  board.getTargets = sq => ({ e2: ['e3', 'e4'], a2: ['a3', 'a4'] }[sq] || [])
  const moves = []
  board.onMove = (f, t) => moves.push(f + t)
  board.setHandMode('grab')

  // Fake hand: real Object3Ds as joints so world-space math runs unchanged.
  const j1 = new THREE.Object3D(), j2 = new THREE.Object3D()
  const hand = { joints: { 'index-finger-tip': j1, 'thumb-tip': j2 } }
  board.boardGroup.updateWorldMatrix(true, false)
  // A grab confirms once the pinch has been held firmly for a moment (board.pendingGrab).
  const hold = () => { if (board.pendingGrab) board.pendingGrab.t0 -= 1000; board._tick() }
  const at = (sq, y = 0.05) => {
    const { x, z } = squareToXZ(sq, S)
    const p = board.boardGroup.localToWorld(new THREE.Vector3(x, y, z))
    j1.position.copy(p)
    j2.position.copy(p)
  }

  // Legal grab-and-drop: e2 pawn to e4
  at('e2')
  board._grabStart(hand); hold()
  check(board.grab?.from === 'e2', 'grabbed e2 pawn')
  check(board.tiles.e2.userData.tint === TINT.select, 'origin tinted')
  check(board.tiles.e4.userData.tint === TINT.target, 'target tinted')
  const pawn = board.grab.piece
  at('e4', 0.08)
  board._tick()
  check(Math.abs(pawn.position.x - squareToXZ('e4', S).x) < 0.001, 'piece follows hand')
  board._grabEnd(hand)
  check(moves.join() === 'e2e4', 'move emitted, got: ' + moves.join())
  check(pawn.position.z === squareToXZ('e4', S).z && pawn.position.y === 0.005, 'snapped to e4')
  check(!board.grab && board.tiles.e2.userData.tint === 0, 'tints cleared')

  // Illegal drop: a2 pawn released on d5 returns home, no move
  board.setPosition('rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1')
  at('a2')
  board._grabStart(hand); hold()
  check(board.grab?.from === 'a2', 'grabbed a2 pawn')
  const pawn2 = board.grab.piece
  at('d5', 0.08)
  board._tick()
  board._grabEnd(hand)
  check(moves.length === 1, 'no move for illegal drop')
  check(pawn2.position.x === squareToXZ('a2', S).x && pawn2.position.z === squareToXZ('a2', S).z,
    'piece returned home')

  // Legal drop the session refuses (e.g. the game just ended): the piece goes home
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  const onMove = board.onMove
  board.onMove = () => false
  at('e2'); board._grabStart(hand); hold()
  const refused = board.grab.piece
  at('e4', 0.08); board._tick(); board._grabEnd(hand)
  check(refused.position.z === squareToXZ('e2', S).z, 'refused drop snaps back to e2')
  board.onMove = onMove

  // Pinch in empty space: no grab
  at('d5')
  board._grabStart(hand); hold()
  check(!board.grab, 'empty-space pinch ignored')

  // Tracking lost mid-grab: piece returns home
  at('a2')
  board._grabStart(hand); hold()
  j1.visible = false
  board._tick()
  check(!board.grab, 'grab cancelled on tracking loss')
  check(pawn2.position.x === squareToXZ('a2', S).x, 'piece home after tracking loss')
  check(moves.length === 1, 'no move on tracking loss')
  j1.visible = true

  // Hand disconnects mid-grab (group hidden, joint flags untouched): piece returns home
  at('a2')
  board._grabStart(hand); hold()
  check(board.grab, 'grabbed before disconnect')
  hand.visible = false
  board._tick()
  check(!board.grab && moves.length === 1, 'disconnect cancels grab')
  hand.visible = true

  // Reach highlight: the piece a pinch would grab lights up before the pinch (hover 'h0'),
  // and the highlight goes once the hand leaves or a grab is under way
  board.hands[0] = hand
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  at('e2'); board._tick()
  check(board.hover.h0 === 'e2', 'reachable piece highlighted, got ' + board.hover.h0)
  at('e2', 0.45); board._tick()
  check(!board.hover.h0, 'no highlight with the hand up in the air')
  at('e5'); board._tick()
  check(!board.hover.h0, 'no highlight when no own piece is near')
  at('e2'); board._grabStart(hand); hold()
  check(board.grab && !board.hover.h0, 'highlight replaced by the grab')
  board._grabEnd(hand)

  // Forgiving timing: a quick pinch grabs nothing, a loose pinch waits, and the piece is chosen
  // when the grab confirms (the hand may still be moving in when the fingers first touch)
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  at('e2'); board._grabStart(hand); board._grabEnd(hand); board._tick()
  check(!board.grab && !board.pendingGrab, 'pinch released at once grabs nothing')
  at('d2'); board._grabStart(hand)
  check(!board.grab && board.pendingGrab, 'grab waits for the hold')
  at('e2'); j2.position.x += 0.02; hold()
  check(!board.grab, 'loose pinch (2 cm) does not grab yet')
  j2.position.copy(j1.position); hold()
  check(board.grab?.from === 'e2', 'piece chosen when the grab confirms, got ' + board.grab?.from)
  board._grabEnd(hand)
  check(moves.length === 1, 'dropped where it was picked: no move')

  // Point (ray) mode: a pinch right at one of your pieces grabs it, and that pinch's
  // selectstart must not also fire a ray pick; a pinch away from the pieces stays a ray pick.
  board.setHandMode('ray')
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  const { ctrl } = board.controllers[0]
  ctrl.userData.isHand = true
  board.hands[0] = hand
  let rayPicks = 0
  const realPick = board._pick
  board._pick = () => { rayPicks++ }
  at('e2')
  ctrl.dispatchEvent({ type: 'selectstart' })
  board._grabStart(hand); hold()
  check(board.grab?.from === 'e2' && rayPicks === 0, `ray mode pinch at a piece grabs it (grab ${board.grab?.from}, ray picks ${rayPicks})`)
  at('e4', 0.08); board._tick(); board._grabEnd(hand)
  check(moves.at(-1) === 'e2e4', 'ray mode grab-drop moves, got ' + moves.at(-1))
  at('e2', 0.45)                                            // hand up in the air: pointing
  board._grabStart(hand); hold()
  ctrl.dispatchEvent({ type: 'selectstart' })
  check(!board.grab && rayPicks === 1, 'pinch away from the pieces is a ray pick')
  board._pick = realPick

  // Picking past a slim piece: the invisible pick cylinders are much wider than the pieces, so a
  // ray that passes beside the queen's real silhouette must reach the pawn behind it.
  board.setPosition('8/8/8/3p4/3Q4/8/8/K6k w - - 0 1')
  board._select(null)
  board._tick()
  const toWorld = (x, y, z) => board.boardGroup.localToWorld(new THREE.Vector3(x, y, z))
  const aim = (sq, y, [dx, dy, dz]) => {
    const { x, z } = squareToXZ(sq, S), t = toWorld(x, y, z), o = toWorld(x + dx, y + dy, z + dz)
    board.raycaster.ray.set(o, t.sub(o).normalize())
  }
  const pawnTop = board.pieceH.p * board.pieceScale * 0.85
  aim('d5', pawnTop, [1.2 * S, 3 * S, 3 * S])
  check(board.raycaster.intersectObject(board.pieceAt.d4.userData.proxy).length > 0, 'test ray crosses the queen cylinder')
  check(board._cast()?.square === 'd5', 'pawn behind the queen pickable, got ' + board._cast()?.square)
  aim('d4', board.pieceH.q * board.pieceScale * 0.5, [0.2 * S, 3 * S, 3 * S])
  check(board._cast()?.square === 'd4', 'aiming at the queen still picks it, got ' + board._cast()?.square)
  aim('d4', 0.004, [1.6 * S, 3 * S, 3 * S])                 // grazing past the queen's cylinder, onto the tile
  check(board._cast()?.square === 'd4', 'tile of an occupied square picks it, got ' + board._cast()?.square)

  out.textContent = 'GRAB-OK'
} catch (e) {
  out.textContent = 'GRAB-FAIL ' + e.message
}
</script>
</body>
</html>
