<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Parallax ui smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
import { TINT } from './src/theme.js'
import * as THREE from 'three'
import { Board3D } from './src/board3d.js'
import { squareToXZ } from './src/coords.js'
import { bindBoard } from './src/bind.js'
import { ENVIRONMENTS } from './src/settings.js'
import { Chess } from 'chess.js'
const out = document.getElementById('result')
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }
const S = 0.06

try {
  const board = new Board3D()
  await board.init()
  const runs = []
  const bar = board.bar

  // Orbit drag ending in a click must not pick; a plain click must.
  let picks = 0
  const realPick = board._pick.bind(board)
  board._pick = () => { picks++; realPick() }
  const canvas = board.renderer.domElement
  const ev = (type, x, y) => canvas.dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true }))
  const pev = (type, x, y) => canvas.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, bubbles: true }))
  pev('pointerdown', 100, 100); ev('click', 180, 140)
  check(picks === 0, 'drag-click ignored')
  pev('pointerdown', 100, 100); ev('click', 102, 101)
  check(picks === 1, 'plain click picks')
  board._pick = realPick

  // Button bar via controller ray, confirm flow and expiry
  board.setStatus({ puzzle: true, text: 't', actions: [
    { label: 'A', run: () => runs.push('A') }, { label: 'B', confirm: true, run: () => runs.push('B') }] })
  check(bar.mesh.visible, 'bar visible with actions')
  const btnWorld = i => bar.mesh.localToWorld(new THREE.Vector3((i - 1) * 0.1, 0.06, 0))
  const rayAt = world => {
    const n = new THREE.Vector3(0, 0, 1).applyQuaternion(bar.mesh.getWorldQuaternion(new THREE.Quaternion()))
    board.raycaster.set(world.clone().addScaledVector(n, 0.3), n.negate())
  }
  bar.mesh.updateMatrixWorld(true)
  rayAt(btnWorld(0)); board._pick()
  check(runs.join() === 'A', 'ray press A, got ' + runs)
  rayAt(btnWorld(1)); board._pick()
  check(runs.join() === 'A' && bar.armed?.label === 'B', 'B armed, not run')
  bar.armedAt -= 4000; bar.tick()
  check(!bar.armed, 'confirm expired')
  rayAt(btnWorld(1)); board._pick()
  check(runs.join() === 'A', 'expired confirm needs two presses again')
  rayAt(btnWorld(1)); board._pick()
  check(runs.join() === 'A,B', 'B confirmed')
  rayAt(btnWorld(2)); board._pick()               // empty slot: falls through to board
  check(runs.join() === 'A,B', 'empty slot does nothing')

  // Status update with same labels keeps the armed confirm
  rayAt(btnWorld(1)); board._pick()
  board.setStatus({ puzzle: true, text: 'u', actions: [{ label: 'B', confirm: true, run: () => runs.push('B2') }] })
  check(bar.armed?.label === 'B', 'armed survives status refresh')
  bar.set([])
  check(!bar.mesh.visible && !bar.armed, 'no actions: bar hidden')

  // Fingertip poke with hysteresis
  board.setStatus({ puzzle: true, text: 't', actions: [{ label: 'A', run: () => runs.push('P') }] })
  const tip = new THREE.Object3D()
  board.hands = [{ joints: { 'index-finger-tip': tip } }]
  board.scene.add(tip)
  const tipAt = z => { tip.position.copy(bar.mesh.localToWorld(new THREE.Vector3(-0.1, 0.06, z))); tip.updateMatrixWorld() }
  const pokes = () => runs.filter(r => r === 'P').length
  tipAt(0.05); board._tick()
  check(pokes() === 0, 'hover does not press')
  tipAt(0.005); board._tick(); board._tick()
  check(pokes() === 1, 'touch presses once, got ' + pokes())
  tipAt(0.015); board._tick()
  check(pokes() === 1, 'jitter near surface no double press')
  tipAt(0.05); board._tick(); tipAt(0.0); board._tick()
  check(pokes() === 2, 'second poke after retreat')
  tipAt(0.05); board._tick(); tipAt(-0.1); board._tick()
  check(pokes() === 2, 'hand behind the bar does not press')
  tip.visible = false; board._tick(); tip.visible = true
  board.hands = []

  // Promotion picker via grab: drop on e8 opens picker, pinch the rook
  const moves = []
  board.onMove = (f, t, p) => moves.push(f + t + (p || ''))
  board.setPosition('8/4P3/8/8/8/8/k7/4K3 w - - 0 1')
  board.canPick = sq => sq === 'e7'
  board.getTargets = sq => sq === 'e7' ? ['e8'] : []
  board.setHandMode('grab')
  const j1 = new THREE.Object3D(), j2 = new THREE.Object3D()
  const hand = { joints: { 'index-finger-tip': j1, 'thumb-tip': j2 } }
  const at = (x, y, z) => {
    const p = board.boardGroup.localToWorld(new THREE.Vector3(x, y, z))
    j1.position.copy(p); j2.position.copy(p)
  }
  const sqAt = (sq, y) => { const c = squareToXZ(sq, S); at(c.x, y, c.z) }
  sqAt('e7', 0.05); board._grabStart(hand); sqAt('e8', 0.06); board._tick(); board._grabEnd(hand)
  check(board.picker && moves.length === 0, 'drop on last rank opens picker')
  const rook = board.picker.group.children[1]
  at(rook.position.x, rook.position.y + 0.03, rook.position.z)
  board._grabStart(hand)
  check(moves.join() === 'e7e8r' && !board.picker, 'rook chosen by pinch, got ' + moves)

  // Cancel: pinch away from the picker -> no move, pawn back home
  board.setPosition('8/4P3/8/8/8/8/k7/4K3 w - - 0 1')
  sqAt('e7', 0.05); board._grabStart(hand); sqAt('e8', 0.06); board._tick(); board._grabEnd(hand)
  sqAt('a1', 0.05); board._grabStart(hand)
  const pawn = board.pieceAt.e7
  check(!board.picker && moves.length === 1, 'picker cancelled')
  check(pawn.position.z === squareToXZ('e7', S).z, 'pawn returned home')

  // Black promotes on rank 1: picker grows toward the center; ray picks the queen
  board.setHandMode('ray')
  board.setOrientation('black')
  board.setPosition('4k3/8/8/8/8/8/4p3/K7 b - - 0 1')
  board.canPick = sq => sq === 'e2'
  board.getTargets = sq => sq === 'e2' ? ['e1', 'd1'] : []
  board._select('e2'); board._select('e1')
  board._tick()                                   // render a frame: world matrices
  const slots = board.picker.group.children
  check(slots.map(s => s.userData.promo).join('') === 'qrbn', 'picker order')
  const onSq = (slot, sq) => slot.position.x === squareToXZ(sq, S).x && slot.position.z === squareToXZ(sq, S).z
  check(onSq(slots[0], 'f1') && onSq(slots[1], 'e1') && onSq(slots[3], 'c1'), 'black picker: queen f1 (black\'s left), target e1 under the 2nd slot like white')
  const q = slots[0].getWorldPosition(new THREE.Vector3())
  board.raycaster.set(q.clone().add(new THREE.Vector3(0, 0.3, 0)), new THREE.Vector3(0, -1, 0))
  board._pick()
  check(moves.at(-1) === 'e2e1q', 'black queen promotion, got ' + moves.at(-1))

  // Non-promotion move emits no promo; picker closed by a new position
  board._select('e2'); board._select('d1')
  check(board.picker, 'capture-promotion opens picker too')
  board.setPosition('4k3/8/8/8/8/8/8/K7 w - - 0 1')
  check(!board.picker, 'setPosition clears picker')

  // Edge files: row stays on the board
  board.setOrientation('white')
  board.setPosition('7k/7P/8/8/8/8/8/K7 w - - 0 1')
  board._openPicker('h7', 'h8')
  const edge = board.picker.group.children
  check(onSq(edge[0], 'e8') && onSq(edge[3], 'h8'), 'h-file picker clamped to e8..h8')
  board._closePicker(null)

  // --- pointing feedback ---
  const local = (x, y, z) => board.boardGroup.localToWorld(new THREE.Vector3(x, y, z))
  const emissive = sq => board.tiles[sq].userData.tint
  board.setOrientation('white')
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  board.scene.updateMatrixWorld(true)

  // Low-angle aim at the e1 king's head hits e1, not the tile behind it
  const e1 = squareToXZ('e1', S)
  const from = local(e1.x, 0.35, 0.6), head = local(e1.x, 0.09, e1.z)
  board.raycaster.set(from, head.clone().sub(from).normalize())
  check(board._cast()?.square === 'e1', 'head aim hits e1, got ' + board._cast()?.square)

  // Controller ray: ends at the hit with a dot; hovered tile brightens; sky clears it
  board.setHandMode('ray')
  const { ctrl, line, dot } = board.controllers[0]
  ctrl.visible = true                          // three shows controllers once connected
  const d4 = squareToXZ('d4', S)
  const aimAt = local(d4.x, 0.005, d4.z)         // tile top surface
  ctrl.position.copy(local(d4.x, 0.5, d4.z + 0.3))
  const aim = target => {                         // controller rays point along local -z
    ctrl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), target.clone().sub(ctrl.position).normalize())
    ctrl.updateMatrix(); ctrl.updateMatrixWorld(true)
  }
  aim(aimAt)
  board._controllerHover()
  check(board.hover.c0 === 'd4', 'controller hovers d4, got ' + board.hover.c0)
  const expect = ctrl.position.distanceTo(aimAt)
  check(Math.abs(line.scale.z - expect) < 0.005 && dot.visible, `ray ends at tile: ${line.scale.z} vs ${expect}`)
  check(board.tiles.d4.material.emissive.getHex() === TINT.hover, 'hover brightens d4')
  aim(local(d4.x, 5, d4.z - 3))
  board._controllerHover()
  check(!board.hover.c0 && line.scale.z === 1.5 && !dot.visible, 'sky: default ray, no hover')
  check(board.tiles.d4.material.emissive.getHex() === 0, 'hover cleared')

  // Hover over a bar button highlights it
  board.setStatus({ puzzle: true, text: 't', actions: [{ label: 'A', run() {} }, { label: 'B', run() {} }] })
  bar.mesh.updateMatrixWorld(true)
  rayAt(btnWorld(1))
  board._hoverRay('mouse')
  check(bar.hovered.mouse === 1, 'bar hover index, got ' + bar.hovered.mouse)
  board.raycaster.set(new THREE.Vector3(0, 5, 0), new THREE.Vector3(0, 1, 0))
  board._hoverRay('mouse')
  check(bar.hovered.mouse === -1, 'bar hover cleared')

  // Check highlight via bindBoard + chess.js
  const chess = new Chess('rnbqkbnr/ppp2ppp/3p4/1B2p3/4P3/8/PPPP1PPP/RNBQK1NR b KQkq - 1 3')
  bindBoard(board, { chess, color: 'black', active: () => true, tryMove() {} })
  board.setPosition(chess.fen())
  check(emissive('e8') === TINT.check, 'king in check tinted, got ' + emissive('e8').toString(16))
  chess.move('c6')
  board.setPosition(chess.fen(), { from: 'c7', to: 'c6' })
  check(emissive('e8') === 0, 'check tint cleared')

  // Grab hover follows the carried piece, cleared on drop
  board.setPosition('8/4P3/8/8/8/8/k7/4K3 w - - 0 1')
  board.canPick = sq => sq === 'e7'
  board.getTargets = () => ['e8']
  board.setHandMode('grab')
  sqAt('e7', 0.05); board._grabStart(hand); sqAt('e8', 0.06); board._tick()
  check(board.hover.grab === 'e8', 'grab hover e8, got ' + board.hover.grab)
  board._grabEnd(hand)
  check(!board.hover.grab, 'grab hover cleared')
  board._closePicker(null)

  // --- thumbstick raises the whole stage, clamped, saved once on release ---
  const saved = []
  board.onHeightChange = h => saved.push(h)
  const stick = { gamepad: { axes: [0, 0, 0, -1] } }       // full forward
  board.controllers[1].ctrl.userData.source = stick
  const y0 = board.tiles.e4.getWorldPosition(new THREE.Vector3()).y
  board.lastTick = performance.now() - 100; board._tick()   // 0.1 s at 0.25 m/s
  check(Math.abs(board.stage.position.y - 0.025) < 0.003, 'raised 2.5 cm, got ' + board.stage.position.y)
  check(saved.length === 0, 'not saved while adjusting')
  for (let i = 0; i < 40; i++) { board.lastTick = performance.now() - 100; board._tick() }
  check(board.stage.position.y === 0.45, 'clamped at +45 cm, got ' + board.stage.position.y)
  const y1 = board.tiles.e4.getWorldPosition(new THREE.Vector3()).y
  check(Math.abs(y1 - y0 - 0.45) < 1e-6, 'board moved with stage')
  check(bar.mesh.getWorldPosition(new THREE.Vector3()).y > 1.2, 'bar moved with stage')
  stick.gamepad.axes[3] = 0.1                                // inside dead zone = released
  board._tick(); board._tick()
  check(saved.length === 1 && saved[0] === 0.45, 'saved once on release: ' + saved)
  stick.gamepad.axes[3] = 1                                  // pull back: lower
  for (let i = 0; i < 80; i++) { board.lastTick = performance.now() - 100; board._tick() }
  check(board.stage.position.y === -0.45, 'clamped at -45 cm')
  board.controllers[1].ctrl.userData.source = null
  board._tick()
  check(saved.at(-1) === -0.45, 'disconnect ends adjustment')
  board.setHeight(0)

  // --- low-time clock turns ember, running clock brass ---
  board.setStatus({ names: { white: 'me', black: 'op' }, myColor: 'white', wtime: 15000, btime: 90000,
    turn: 'b', running: true, text: 'Waiting…' })
  check(board.panel.pills.w === '#D5543F', 'my low clock ember, got ' + board.panel.pills.w)
  check(board.panel.pills.b === '#D9A441', 'running clock brass, got ' + board.panel.pills.b)

  // --- captured pieces beside the board; shared materials/geometry ---
  board.setOrientation('white')
  board.setPosition('rnb1kbnr/ppppppp1/8/8/8/8/PPP1PPPP/R1BQKBNR w KQkq - 0 1')
  const cap = board.capturedGroup.children
  check(cap.length === 4, 'four captured pieces shown, got ' + cap.length)
  const blackLost = cap.filter(c => c.position.x > 0), whiteLost = cap.filter(c => c.position.x < 0)
  check(blackLost.length === 2 && whiteLost.length === 2, 'split by side')
  check(blackLost.every(c => c.position.x > 4 * S) && whiteLost.every(c => c.position.x < -4 * S), 'off the board')
  check(blackLost[0].position.z > 0 && whiteLost[0].position.z < 0, "near each capturer's side")
  board.raycaster.set(board.capturedGroup.localToWorld(blackLost[0].position.clone().setY(0.3)), new THREE.Vector3(0, -1, 0))
  board.scene.updateMatrixWorld(true)
  check(!board._cast()?.square, 'captured pieces are not pickable')
  const mats = new Set(), geos = new Set()
  for (let i = 0; i < 3; i++) board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  board.piecesGroup.traverse(m => { if (m.isMesh && m.material.visible) mats.add(m.material) })
  board.piecesGroup.children.forEach(p => geos.add(p.userData.proxy.geometry))
  check(mats.size === 2, 'two shared piece materials, got ' + mats.size)
  check(geos.size === 6, 'one proxy geometry per piece type, got ' + geos.size)
  check(board.capturedGroup.children.length === 0, 'no captures at start')

  // --- scaled + flipped board: aiming, hover and grab still map to the right squares ---
  board.setOrientation('white')
  board.setFlipped(true)
  board.setScale(1.5)
  check(board.bar.mesh.position.x > 0.55, 'bar moved out for a big board: ' + board.bar.mesh.position.x)
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  board.scene.updateMatrixWorld(true)
  const lw = (sq, y) => { const c = squareToXZ(sq, S); return board.boardGroup.localToWorld(new THREE.Vector3(c.x, y, c.z)) }
  const e1w = lw('e1', 0.09)
  check(e1w.z < board.boardGroup.getWorldPosition(new THREE.Vector3()).z, 'flipped: e1 is on the far side')
  const eye = lw('e1', 0.09).add(new THREE.Vector3(0, 0.3, 0.25))
  board.raycaster.set(eye, e1w.clone().sub(eye).normalize())
  check(board._cast()?.square === 'e1', 'aim at scaled far king hits e1, got ' + board._cast()?.square)
  board.canPick = sq => sq === 'e2'
  board.getTargets = () => ['e4']
  board.onMove = (f, t) => moves.push(f + t)
  board.setHandMode('grab')
  j1.position.copy(lw('e2', 0.05)); j2.position.copy(j1.position)
  board._grabStart(hand)
  check(board.grab?.from === 'e2', 'grab on scaled board')
  j1.position.copy(lw('e4', 0.07)); j2.position.copy(j1.position)
  board._tick(); board._grabEnd(hand)
  check(moves.at(-1) === 'e2e4', 'drop on scaled flipped board, got ' + moves.at(-1))
  board.setHandMode('ray')
  board.setScale(1); board.setFlipped(false)
  check(board.bar.mesh.position.x === 0.4 && board.table.scale.x === 1, 'scale reset')

  // --- environments: all build, look different, switching doesn't leak GPU memory ---
  const backgrounds = new Set()
  const childCount = board.scene.children.length
  const snapshot = () => ({ ...board.renderer.info.memory })
  let mem1, programs1
  const lights = () => { let n = 0; board.scene.traverse(o => { if (o.isLight) n++ }); return n }
  const lightCount = lights()
  for (let round = 0; round < 3; round++) {
    for (const name of ENVIRONMENTS) {
      board.setEnvironment(name)
      board._tick()                                   // render: uploads geometries/textures
      check(board.environment === name && board.scene.children.length === childCount, 'env swap keeps scene size: ' + name)
      backgrounds.add(board.scene.background.getHex())
      check(lights() === lightCount, 'constant light count (no shader recompiles): ' + name)
    }
    if (round === 0) { mem1 = snapshot(); programs1 = board.renderer.info.programs.length }
  }
  const mem3 = snapshot()
  check(backgrounds.size === ENVIRONMENTS.length, 'each scene has its own background')
  check(mem3.geometries <= mem1.geometries && mem3.textures <= mem1.textures,
    `no leak: ${JSON.stringify(mem1)} -> ${JSON.stringify(mem3)}`)
  check(board.renderer.info.programs.length === programs1, 'no new shader programs after the first cycle')
  board.setEnvironment('foo')
  check(board.environment === 'minimal', 'unknown scene falls back to minimal')
  board.setEnvironment('study')
  let instanced = 0, meshes = 0
  board.envGroup.traverse(o => { if (o.isInstancedMesh) instanced++; else if (o.isMesh) meshes++ })
  check(instanced === 1 && meshes < 30, `study draw calls bounded: ${meshes} meshes + ${instanced} instanced`)
  check(board.lamp.intensity > 0, 'study lamp on')
  board.setEnvironment('minimal')
  check(board.lamp.intensity === 0, 'lamp off in minimal')

  // scenes are alive: update() animates them (fire flicker, clock, birds, shooting stars)
  const run = (from, to, step = 0.05) => { for (let t = from; t < to; t += step) board.env.update(t, step, board) }
  board.setEnvironment('study')
  const lampLevels = new Set()
  for (let t = 0; t < 1; t += 0.05) { board.env.update(t, 0.05, board); lampLevels.add(board.lamp.intensity.toFixed(2)) }
  check(lampLevels.size > 5, 'fire light flickers: ' + lampLevels.size + ' levels')
  const swinging = []
  board.envGroup.traverse(o => { if (o.userData.dynamic && o.isGroup) swinging.push(o) })
  const angles = new Set([0.25, 0.5, 1.5].map(t => { board.env.update(t, 0.05, board); return swinging.map(o => o.rotation.z.toFixed(3)).join() }))
  check(swinging.length >= 3 && angles.size === 3, 'clock hands/pendulum move: ' + [...angles])
  board.setEnvironment('sunset')
  const bird = board.envGroup.children.find(o => o.isMesh && o.geometry.attributes.position.count === 6)
  board.env.update(10, 0.1, board)
  const b1 = bird.position.clone()
  board.env.update(12, 0.1, board)
  check(bird.position.distanceTo(b1) > 0.5, 'birds fly')
  board.setEnvironment('night')
  const streak = board.envGroup.children.find(o => o.isMesh && o.geometry.parameters?.width === 2.4)
  let seen = false
  for (let t = 0; t < 20 && !seen; t += 0.05) { board.env.update(t, 0.05, board); seen = streak.material.opacity > 0.3 }
  check(seen, 'a shooting star crosses the sky within 20 s')
  for (const env of ENVIRONMENTS) {
    board.setEnvironment(env)
    let draws = 0
    board.envGroup.traverse(o => { if (o.isMesh || o.isPoints || o.isSprite) draws++ })
    check(draws <= 45, `${env}: draw calls bounded for Quest (${draws})`)
  }
  board.setEnvironment('minimal')

  // shadows follow the stage and cover a scaled board
  check(board.sun.parent === board.stage, 'sun moves with the table')
  board.setScale(1.5)
  check(Math.abs(board.sun.shadow.camera.right - 1.05) < 1e-9, 'shadow box scaled: ' + board.sun.shadow.camera.right)
  board.setScale(1)

  // --- blindfold styles: hidden pieces stay pickable; picker always solid; timed reveal ---
  board.setPosition('8/4P3/8/8/8/8/k7/4K3 w - - 0 1')
  const wMat = board.pieceMat.w
  board.setPieceStyle('ghost')
  check(wMat.transparent && wMat.opacity === 0.25 && wMat.visible, 'ghost material')
  let shadows = 0
  board.piecesGroup.traverse(m => { if (m.isMesh && m.castShadow) shadows++ })
  check(shadows === 0, 'ghost pieces cast no shadows')
  board.setPieceStyle('hidden')
  check(!wMat.visible, 'hidden material')
  board.scene.updateMatrixWorld(true)
  const e7 = squareToXZ('e7', S)
  board.raycaster.set(board.boardGroup.localToWorld(new THREE.Vector3(e7.x, 0.3, e7.z)), new THREE.Vector3(0, -1, 0))
  check(board._cast()?.square === 'e7', 'hidden piece still pickable')
  board._openPicker('e7', 'e8')
  const pickerMats = new Set()
  board.picker.group.children.forEach(slot => slot.children[1].traverse(m => {
    if (m.isMesh && m.visible && m !== slot.children[1].userData.proxy) pickerMats.add(m.material)
  }))
  check(pickerMats.size === 1 && pickerMats.has(board.solidMat.w) && board.solidMat.w.visible, 'promotion picker pieces stay solid when hidden')
  board._closePicker(null)
  board.showPieces(100)
  check(wMat.visible && !wMat.transparent, 'show pieces reveals')
  await new Promise(r => setTimeout(r, 200))
  check(!wMat.visible && board.pieceStyle === 'hidden', 'back to hidden after the reveal')
  board.setPieceStyle('solid')
  check(wMat.visible && wMat.opacity === 1 && !wMat.transparent, 'solid again')

  // --- shadow map re-renders only after changes ---
  board._tick()
  check(!board.shadowsDirty, 'clean after a frame')
  board.renderer.shadowMap.needsUpdate = false
  board._tick()
  check(board.renderer.shadowMap.needsUpdate === false, 'idle frame skips the shadow pass')
  board.setPosition('8/8/8/8/8/8/8/K6k w - - 0 1')
  check(board.shadowsDirty, 'setPosition marks shadows dirty')
  board._tick()
  check(!board.shadowsDirty, 'shadow pass consumed')

  // --- themes, per-scene reflections, capture sparks ---
  for (const t of ['walnut', 'green', 'ice', 'marble', 'midnight']) {
    board.setBoardTheme(t)
    check(board.boardTheme === t && board.tiles.h8.material.map, 'board theme ' + t)
  }
  board.setBoardTheme('nope')
  check(board.boardTheme === 'walnut', 'unknown board theme falls back to walnut')
  board.setMarks({ e4: TINT.hint })
  check(board.tiles.e4.material.color.getHex() !== board.tiles.e4.userData.base.getHex(), 'tints still show over a theme')
  board.setMarks({})
  check(board.tiles.e4.material.color.getHex() === board.tiles.e4.userData.base.getHex(), 'tint cleared back to the theme color')
  board.setPieceTheme('gold')
  check(board.pieceMat.w.metalness === 0.85 && board.solidMat.w.metalness === 0.85, 'gold set is metallic (picker too)')
  board.setPieceTheme('neon')
  check(board.pieceMat.b.emissive.getHex() === 0x8a1066, 'neon glows')
  board.setPieceTheme('ivory')
  check(board.pieceMat.b.emissive.getHex() === 0 && board.pieceMat.w.metalness === 0.05, 'defaults restored')
  board.setEnvironment('study')
  const envStudy = board.pieceMat.w.envMap
  board.setEnvironment('night')
  check(board.pieceMat.w.envMap && board.pieceMat.w.envMap !== envStudy, 'pieces reflect each scene')
  board.setEnvironment('minimal')
  board.setPosition('rnbqkbnr/ppp1pppp/8/3P4/8/8/PPPP1PPP/RNBQKBNR b KQkq - 0 2', { from: 'e4', to: 'd5', captured: 'p' })
  board.lastTick = performance.now() - 50; board._tick()
  check(board.sparks.some(sp => sp.material.opacity > 0.3), 'capture throws sparks')
  board.burstT0 -= 1000; board._tick()
  check(board.sparks.every(sp => sp.material.opacity === 0) && !board.burstT0, 'sparks fade out')

  // --- contact shadows follow the pieces, hide in blindfold ---
  board.setPosition('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')
  board._tick()
  check(board.contacts.count === 32, 'one contact shadow per piece: ' + board.contacts.count)
  const m4 = new THREE.Matrix4(), pos = new THREE.Vector3()
  board.contacts.getMatrixAt(0, m4); pos.setFromMatrixPosition(m4)
  const p0 = board.piecesGroup.children[0].position
  check(Math.abs(pos.x - p0.x) < 1e-6 && Math.abs(pos.z - p0.z) < 1e-6, 'shadow under its piece')
  board.setPosition('rnbqkbnr/pppp1ppp/8/8/8/8/PPPPPPPP/RNBQKBN1 w Qkq - 0 1')
  board._tick()
  check(board.contacts.count === 32, 'captured pieces keep a (smaller) shadow: ' + board.contacts.count)
  board.setPieceStyle('hidden')
  check(!board.contacts.visible, 'blindfold hides contact shadows')
  board.setPieceStyle('solid')
  check(board.contacts.visible, 'shadows back')

  // --- procedural piece detail: every set compiles and renders without shader errors ---
  const shaderErrors = []
  const realErr = console.error
  console.error = (...a) => { shaderErrors.push(a.join(' ')); realErr(...a) }
  for (const [set, kind] of [['ivory', 1], ['maple', 2], ['gold', 3], ['neon', 4], ['classic', 1]]) {
    board.setPieceTheme(set)
    board._tick()
    check(board.detailU.uDetail.value === kind, `${set}: detail kind ${kind}, got ${board.detailU.uDetail.value}`)
  }
  console.error = realErr
  check(!shaderErrors.some(e => /Shader|WebGL/i.test(e)), 'piece detail shader compiles: ' + shaderErrors.join(' | ').slice(0, 300))
  board.setPieceTheme('ivory')

  board.cue('capture'); board.cue('error')        // must not throw
  out.textContent = 'UI-OK'
} catch (e) {
  out.textContent = 'UI-FAIL ' + e.message
}
</script>
</body>
</html>
