<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Parallax rush smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
import { Board3D } from './src/board3d.js'
import { RushSession } from './src/rush.js'
const out = document.getElementById('result')
const sleep = ms => new Promise(r => setTimeout(r, ms))
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }

try {
  localStorage.removeItem('rushBest')
  localStorage.setItem('puzzleStats', JSON.stringify({ streak: 7, best: 9, solved: 20 }))
  const board = new Board3D()
  await board.init()
  const diffs = []
  const mate1 = { game: { pgn: 'f3 e5 g4' }, puzzle: { id: 'm', rating: 600, solution: ['d8h4'] } }
  let failNext = 0
  const lichess = { puzzleNext: async d => {
    if (failNext-- > 0) throw new Error('offline')
    diffs.push(d); return mate1
  } }
  const cues = []
  const realCue = board.cue.bind(board)
  board.cue = k => { cues.push(k); realCue(k) }
  const r = new RushSession({ lichess, board, menu: () => [{ label: 'Menu', run() {} }] })
  const labels = () => board.bar.buttons.map(b => b.label).join()
  const until = async (cond, what) => { for (let i = 0; i < 150 && !cond(); i++) await sleep(20); check(cond(), what) }

  r.start()
  await until(() => r.running, 'first puzzle loaded')
  check(/^Score 0 · ♥♥♥ · 1(80|79) s$/.test(board.panel.status.sub), 'rush header: ' + board.panel.status.sub)
  check(labels() === 'Flip board,End rush', 'no hint/next during rush: ' + labels())
  check(diffs[0] === 'easiest', 'starts easiest')

  for (let i = 0; i < 5; i++) {
    await until(() => r.running, 'puzzle ' + i)
    board.onMove('d8', 'h4')
  }
  await until(() => r.running && diffs.length === 6, 'sixth puzzle')
  check(r.score === 5 && diffs[5] === 'easier', 'difficulty rises after 5: ' + diffs)

  // Wrong move: lose a life, move on (no retry)
  const fetched = diffs.length
  board.onMove('b8', 'c6')
  check(r.lives === 2 && board.panel.status.text === 'Wrong — 2 lives left', 'life lost: ' + board.panel.status.text)
  check(!board.canPick('d8'), 'no moves until the next puzzle')
  await until(() => r.running && diffs.length === fetched + 1, 'moved on to a new puzzle')
  check(board.panel.status.sub.includes('♥♥ ·') && !board.panel.status.sub.includes('♥♥♥'), 'two hearts: ' + board.panel.status.sub)

  // A failed fetch retries instead of leaving the board empty
  failNext = 1
  board.onMove('b8', 'c6')
  await until(() => board.panel.status.text === 'Network hiccup — retrying…', 'retry shown')
  await until(() => r.running, 'recovered after retry')

  // The last mistake ends the rush with the error cue only
  cues.length = 0
  board.onMove('b8', 'c6')
  check(r.over && board.panel.status.text === 'Rush over — 5 solved', 'over after 3 lives: ' + board.panel.status.text)
  check(cues.join() === 'error,error', 'error cues only (move + end): ' + cues)
  check(localStorage.getItem('rushBest') === '5' && board.panel.status.sub === 'Best 5', 'best saved')
  check(labels() === 'New rush,Flip board,Menu', 'end bar: ' + labels())
  check(JSON.parse(localStorage.getItem('puzzleStats')).streak === 7, 'rush does not touch the puzzle streak')
  const n = diffs.length
  r.next(); await sleep(50)
  check(diffs.length === n, 'no fetch after the rush is over')

  // Time runs out; a piece selected before the end cannot score afterwards
  board.bar.buttons[0].run()
  await until(() => r.running, 'new rush loaded')
  check(r.score === 0 && r.lives === 3, 'reset for the new rush')
  board._select('d8')
  r.endAt = performance.now() - 1
  await sleep(300)
  check(r.over && board.panel.status.text === 'Rush over — 0 solved', 'time up ends the rush')
  board.onMove('d8', 'h4')
  check(r.score === 0 && board.panel.status.text === 'Rush over — 0 solved', 'no scoring after the end')
  check(localStorage.getItem('rushBest') === '5', 'lower score keeps best')

  // stop() kills the clock: no redraws afterwards
  board.bar.buttons[0].run(); await until(() => r.running, 'third rush')
  r.stop()
  let draws = 0
  const real = board.setStatus.bind(board)
  board.setStatus = s => { draws++; real(s) }
  await sleep(1300)
  check(draws === 0, 'no clock redraws after stop: ' + draws)

  out.textContent = 'RUSH-OK'
} catch (e) {
  out.textContent = 'RUSH-FAIL ' + e.message
}
</script>
</body>
</html>
