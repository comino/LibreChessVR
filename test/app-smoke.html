<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>LibreChessVR app smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
// Drives the real index.html UI + main.js against a fake lichess (stubbed fetch).
const out = document.getElementById('result')
const sleep = ms => new Promise(r => setTimeout(r, ms))
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }
async function until(cond, what, ms = 10000) {
  for (const t0 = performance.now(); performance.now() - t0 < ms; await sleep(20)) if (cond()) return
  throw new Error('timeout: ' + what)
}

// Controllable NDJSON streams keyed by path
const streams = {}, requests = [], routes = {}
const deferred = () => {
  let resolve, reject
  const promise = new Promise((yes, no) => { resolve = yes; reject = no })
  return { promise, resolve, reject }
}
function openStream(path, signal) {
  const enc = new TextEncoder()
  let ctl
  const body = new ReadableStream({ start: c => { ctl = c } })
  const s = streams[path] = { closed: false, push: o => ctl.enqueue(enc.encode(JSON.stringify(o) + '\n')) }
  const heartbeat = setInterval(() => ctl.enqueue(enc.encode('\n')), 1000)
  signal?.addEventListener('abort', () => { clearInterval(heartbeat); s.closed = true; ctl.error(new DOMException('aborted', 'AbortError')) })
  return new Response(body)
}
const json = o => new Response(JSON.stringify(o), { headers: { 'content-type': 'application/json' } })
const puzzle = { game: { pgn: 'e4 e5' }, puzzle: { id: 'p1', rating: 1000, solution: ['f1c4'] } }
const full = id => ({ type: 'gameFull', initialFen: 'startpos', white: { id: 'me' }, black: { aiLevel: 2 },
  clock: { initial: 600000, increment: 0 },
  state: { type: 'gameState', moves: '', wtime: 6e5, btime: 6e5, status: 'started' } })
const realFetch = window.fetch
window.fetch = async (url, opts = {}) => {
  if (typeof url !== 'string' || !url.startsWith('https://lichess.org')) return realFetch(url, opts)
  const path = url.replace('https://lichess.org', '')
  requests.push({ path, method: opts.method || 'GET', body: String(opts.body || ''), auth: !!opts.headers?.Authorization })
  if (routes[path]) return routes[path](opts)
  if (path === '/api/account') return json({ username: 'me' })
  if (path === '/api/account/playing') return json({ nowPlaying: [] })
  if (path.startsWith('/api/puzzle/next')) return json(puzzle)
  if (path === '/api/challenge/ai') {
    setTimeout(() => streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g1' } }), 10)
    return json({ id: 'g1' })
  }
  if (path.startsWith('/api/board/game/stream/')) {
    const r = openStream(path, opts.signal)
    setTimeout(() => streams[path].push(full()), 10)
    return r
  }
  if (['/api/stream/event', '/api/board/seek'].includes(path)) return openStream(path, opts.signal)
  return json({ ok: true })
}

try {
  const html = await (await realFetch('/index.html')).text()
  document.body.append(new DOMParser().parseFromString(html, 'text/html').getElementById('ui'))
  localStorage.clear()
  localStorage.setItem('lichessToken', 'tok')
  localStorage.setItem('settings', JSON.stringify({ time: '5', inc: '0', ailevel: '2' }))
  localStorage.setItem('tableHeight', '0.2')
  // Rendering performance/scene assets have their own suite. Keep stream and navigation
  // assertions independent of software-renderer shader compilation and CDN latency.
  localStorage.setItem('environment', 'minimal')
  // PRJ-72: a challenge sent just before a reload still blocks new starts.
  localStorage.setItem('pendingChallenge.me', JSON.stringify({ id: 'restored', label: 'Ann', at: Date.now() }))
  await import('/src/main.js')
  const { board, navigation } = window.parallax, $ = id => document.getElementById(id)
  check(board.knightFacing === 'right' && $('knightFacing').value === 'right', 'sideways knights are the default in the app and desktop control')
  check(!board.viewLocked && board.controls.enabled && $('viewLock').textContent === 'Lock view', 'view starts unlocked without a saved preference')
  await until(() => !$('cancelChallenge').hidden, 'challenge from before the reload restored')
  check($('ai').disabled && $('maiaBtn').disabled && $('seek').disabled, 'restored challenge blocks new starts')
  const restoredBefore = requests.length
  $('ai').onclick()
  check(!requests.slice(restoredBefore).some(r => r.path.startsWith('/api/challenge/')), 'no second challenge while one is restored')
  $('cancelChallenge').click()
  await until(() => $('cancelChallenge').hidden && !$('ai').disabled, 'restored challenge cancelled')
  check(requests.some(r => r.path === '/api/challenge/restored/cancel' && r.method === 'POST') && !localStorage.getItem('pendingChallenge.me'),
    'cancel withdraws the restored challenge on Lichess and forgets it')
  const surface = () => board.menuOpen ? board.menuPanel : board.bar
  const labels = () => surface().buttons.map(b => b.label).join()
  const press = label => {
    const ui = surface(), uv = ui.buttonUV(label)
    check(uv, `button "${label}" in [${labels()}]`)
    check(ui.press(uv.x, uv.y), `button "${label}" can be pressed (${board.fen}; ${board.bar.title})`)
  }
  const back = () => press('‹ Back')
  const resume = () => press(board.menuPanel.page.returnAction.label)
  const home = () => { if (board.menuOpen) resume(); press('Menu') }
  const setup = (page, field, value) => { press(page); press(field); press(value); back(); back() }
  const menuSlot = () => JSON.stringify(board.bar.buttonUV('Menu'))

  await until(() => $('play').style.display !== 'none' && streams['/api/stream/event'], 'logged in')
  check(board.menuPanel.page.title === 'Menu' && labels().includes('Practice,Free board,Play,Settings'), 'clear home categories')
  check($('time').value === '5' && $('ailevel').value === '2', 'settings restored into form')
  const returnBounds = JSON.stringify(board.menuPanel.buttonUV('Return to free board'))
  resume()
  const fixedMenuSlot = menuSlot()
  check(board.stage.position.y === 0.2 && board.canPick('e2'), 'height restored and free board active')
  check(!board.onMove('e2', 'e5'), 'free board refuses illegal moves')
  check(board.onMove('e2', 'e4') && board.onMove('e7', 'e5'), 'free board legal moves')
  check(board.moveList.lines.join('|') === '1. e4 e5', 'free board moves listed')
  const fen = board.fen
  press('Menu'); press('Settings'); press('Comfort')
  check(board.menuPanel.page.path === 'Menu / Settings', 'breadcrumb beside controls')
  check(JSON.stringify(board.menuPanel.buttonUV('Return to free board')) === returnBounds, 'return target stays fixed')
  const position = board.menuPanel.mesh.position.clone()
  press('Table up'); press('Table up')
  check(Math.abs(board.stage.position.y - 0.3) < 1e-9 && localStorage.getItem('tableHeight') === '0.300', 'height changed and persisted')
  check(board.menuPanel.mesh.position.equals(position), 'height changes do not move menu')
  press('Board size'); press('125%')
  check(board.boardScale === 1.25 && localStorage.getItem('boardScale') === '1.25', 'board size selected and persisted')
  check(board.menuPanel.mesh.position.equals(position), 'resizing board does not move menu')
  back(); check(board.menuPanel.page.title === 'Comfort', 'Back returns to parent')
  resume()
  check(board.fen === fen && board.moveList.lines.join('|') === '1. e4 e5', 'menu preserves board and move history')
  press('Undo')
  check(board.pieceAt.e7 && board.pieceAt.e4, 'Undo survives menu and settings')
  check(menuSlot() === fixedMenuSlot, 'Menu target stays fixed when free-board actions change')
  press('Reset board'); press('Reset board')
  check(board.pieceAt.e2 && !board.moveList.mesh.visible, 'explicit reset returns to start')

  // A delayed creation must stay cancellable without ever sending a second challenge.
  const maiaCreation = deferred()
  routes['/api/challenge/maia5'] = () => maiaCreation.promise
  routes['/api/challenge/pending-maia/cancel'] = () => new Response('{"error":"temporary failure"}', { status: 503 })
  const challengesBefore = requests.filter(r => r.path.startsWith('/api/challenge/')).length
  $('maiaBtn').click(); $('maiaBtn').onclick(); $('ai').onclick(); $('seek').onclick()
  check(requests.filter(r => r.path.startsWith('/api/challenge/')).length === challengesBefore + 1, 'pending challenge blocks repeated and alternate starts')
  check($('ai').disabled && $('maiaBtn').disabled && $('seek').disabled && !$('cancelChallenge').hidden,
    'desktop exposes pending state and cancellation')
  home(); press('Play'); press('Stockfish')
  check(board.menuPanel.buttons.find(b => b.label === 'Start game').disabled, 'VR also disables duplicate starts')
  press('Cancel challenge')
  check($('cancelChallenge').disabled, 'cancel before creation waits for the response')
  maiaCreation.resolve(json({ challenge: { id: 'pending-maia' } }))
  await until(() => $('msg').textContent.includes('Cancellation failed'), 'cancellation error')
  check($('ai').disabled && !$('cancelChallenge').disabled, 'failed cancellation retains the guard and permits retry')
  check(JSON.parse(localStorage.getItem('pendingChallenge.me') || '{}').id === 'pending-maia', 'open challenge survives a reload')
  routes['/api/challenge/pending-maia/cancel'] = () => json({ ok: true })
  $('cancelChallenge').click()
  await until(() => !$('ai').disabled && $('cancelChallenge').hidden, 'cancellation confirmed')
  home(); press('Play'); press('Online player'); press('Time control'); press('10+5'); back(); press('Find opponent')
  await until(() => streams['/api/board/seek'] && !streams['/api/board/seek'].closed, 'seek open before the late event')
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'pending-maia' } })
  await sleep(50)
  check(!streams['/api/board/game/stream/pending-maia'], 'late event from a cancelled challenge cannot take over the board')
  check(!streams['/api/board/seek'].closed, 'an ignored late start keeps the new seek running (Codex)')
  $('seek').onclick()
  await until(() => streams['/api/board/seek'].closed, 'seek cancelled')
  delete routes['/api/challenge/maia5']
  // An unknown-status challenge (creation failed with 503) must not lock all game starts forever.
  routes['/api/challenge/maia5'] = () => new Response('{"error":"bad gateway"}', { status: 503 })
  $('maiaBtn').click()
  await until(() => $('msg').textContent.includes('status unknown'), 'unknown challenge status')
  check(!$('cancelChallenge').disabled, 'an unknown-status challenge can be cancelled')
  $('cancelChallenge').click()
  await until(() => !$('ai').disabled && $('cancelChallenge').hidden, 'unknown-status lock released')
  delete routes['/api/challenge/maia5']
  streams['/api/stream/event'].push({ type: 'gameStart' })
  await sleep(50)
  check(!$('msg').textContent.includes('Event stream lost'), 'a gameStart without a game never breaks the event stream')

  home(); press('Play'); press('Stockfish')
  press('Level'); press('3'); check(board.menuPanel.buttons.find(b => b.label === '3').selected, 'selected value is marked')
  back(); press('Level'); press('2'); back()
  check($('ailevel').value === '2', 'level can decrease directly')
  press('Time control'); press('10+0'); back()
  press('Your side'); press('White'); back()
  check($('time').value === '10' && $('inc').value === '0' && $('color').value === 'white', 'game setup updates desktop form')
  check(JSON.parse(localStorage.getItem('settings')).ailevel === '2', 'settings persisted')
  const initialAiCount = requests.filter(r => r.path === '/api/challenge/ai').length
  press('Start game')
  $('ai').onclick(); $('maiaBtn').onclick()
  check(requests.filter(r => r.path === '/api/challenge/ai').length === initialAiCount + 1, 'initial game start sends one POST')
  await until(() => labels().includes('Abort'), 'game attached')
  check(labels() === 'Offer draw,Flip board,Abort,Menu', 'menu available during live game')
  const ai = requests.find(r => r.path === '/api/challenge/ai')
  check(/level=2/.test(ai.body) && /clock.limit=600/.test(ai.body) && /color=white/.test(ai.body), 'game uses chosen settings')
  // Exercise the actual desktop handler with a page clock below three seconds.
  const nowDescriptor = Object.getOwnPropertyDescriptor(performance, 'now')
  try {
    Object.defineProperty(performance, 'now', { configurable: true, value: () => 1000 })
    $('resign').click()
    check(!requests.some(r => r.path === '/api/board/game/g1/resign') && $('resign').textContent === 'Confirm resign',
      'early first desktop click only arms resignation')
    $('resign').click()
    check(requests.filter(r => r.path === '/api/board/game/g1/resign').length === 1, 'second desktop click confirms once')
  } finally {
    if (nowDescriptor) Object.defineProperty(performance, 'now', nowDescriptor)
    else delete performance.now
  }
  press('Menu')
  check(board.menuPanel.buttons.find(b => b.label === 'Practice').disabled, 'cannot replace live game')
  press('Settings'); press('Input & audio'); press('Spoken moves'); press('Opponent only'); back()
  check(board.voice === 'opponent' && localStorage.getItem('voice') === 'opponent', 'audio adjustable in game')
  const menuPage = board.menuPanel.page.id
  streams['/api/board/game/stream/g1'].push({ type: 'gameState', moves: 'e2e4 e7e5', wtime: 590000, btime: 589000, status: 'started' })
  await until(() => board.pieceAt.e4 && board.pieceAt.e5, 'game updates under menu')
  check(board.menuOpen && board.menuPanel.page.id === menuPage && board.panel.status.running, 'stream keeps clock live without replacing route')
  const liveFen = board.fen
  board._select('g1'); board._select('f3')
  check(board.fen === liveFen && board.selected == null, 'menu blocks board selections')
  resume()
  check(board.canPick('g1') && labels().includes('Resign') && menuSlot() === fixedMenuSlot, 'return restores game controls')
  const resignUV = JSON.stringify(board.bar.buttonUV('Resign'))
  streams['/api/board/game/stream/g1'].push({ type: 'gameState', moves: 'e2e4 e7e5', wtime: 590000, btime: 589000, status: 'started', bdraw: true })
  await until(() => labels().includes('Accept draw'), 'draw offer')
  check(JSON.stringify(board.bar.buttonUV('Resign')) === resignUV && menuSlot() === fixedMenuSlot, 'draw offer does not move exit or resign')
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g9', speed: 'rapid' } })
  await sleep(50)
  check(!streams['/api/board/game/stream/g9'], 'second game cannot replace live game')
  streams['/api/board/game/stream/g1'].push({ type: 'gameState', moves: 'f2f3 e7e5 g2g4 d8h4', wtime: 6e5, btime: 6e5, status: 'mate', winner: 'black' })
  await until(() => labels().includes('Review game'), 'game finished')
  press('Review game'); press('Prev move'); press('Prev move')
  check(board.moveList.cur === 1 && board.bar.title === 'Game review', 'review identifies its mode and current move')
  const reviewFen = board.fen
  press('Menu'); press('Settings'); resume()
  check(board.fen === reviewFen && board.moveList.cur === 1, 'menu preserves review position')
  press('Done')
  check(board.moveList.cur === 3, 'Done returns to final position')
  const aiBefore = requests.filter(r => r.path === '/api/challenge/ai').length
  const rematchCreation = deferred()
  routes['/api/challenge/ai'] = () => rematchCreation.promise
  press('Rematch')
  await until(() => requests.filter(r => r.path === '/api/challenge/ai').length > aiBefore, 'rematch request')
  $('ai').onclick(); $('maiaBtn').onclick()
  check(requests.filter(r => r.path === '/api/challenge/ai').length === aiBefore + 1 && $('ai').disabled,
    'rematch shares the pending guard with desktop game starts')
  check(/color=black/.test(requests.filter(r => r.path === '/api/challenge/ai').at(-1).body), 'rematch swaps side')
  rematchCreation.resolve(json({ id: 'rematch1' }))
  await sleep(20)
  streams['/api/stream/event'].push({ type: 'challengeDeclined', challenge: { id: 'x' } })
  await sleep(20)
  check($('ai').disabled, 'unrelated decline cannot release a pending challenge')
  streams['/api/stream/event'].push({ type: 'challengeDeclined', challenge: { id: 'rematch1' } })
  await until(() => board.panel.status.text.includes('Challenge declined'), 'decline visible')
  check(!$('ai').disabled, 'matching decline permits another game')
  delete routes['/api/challenge/ai']
  const lateFailure = deferred()
  routes['/api/challenge/ai'] = () => lateFailure.promise
  $('ai').onclick()

  home(); press('Practice'); press('Puzzles'); press('Difficulty'); press('Harder'); back()
  press('Theme'); press('Mate in 2'); back(); press('Start puzzles')
  await until(() => labels().includes('Hint'), 'puzzle ready')
  lateFailure.resolve(new Response('{"error":"rejected"}', { status: 400 }))
  await until(() => $('msg').textContent.includes('Stockfish challenge failed'), 'late challenge failure logged')
  check(!$('desktopStatus').textContent.includes('challenge failed'), "a late challenge failure never overwrites another activity's desktop status (Codex)")
  delete routes['/api/challenge/ai']
  check(requests.some(r => r.path === '/api/puzzle/next?difficulty=harder&angle=mateIn2'), 'puzzle settings used in fetch')
  check(requests.filter(r => r.path.startsWith('/api/puzzle/next')).every(r => !r.auth), 'puzzle fetches anonymous')
  const puzzleFen = board.fen, fetched = requests.filter(r => r.path.startsWith('/api/puzzle/next')).length
  press('Menu'); press('Settings'); press('Comfort'); resume()
  check(board.fen === puzzleFen && labels().includes('Hint'), 'return resumes same puzzle')
  check(requests.filter(r => r.path.startsWith('/api/puzzle/next')).length === fetched, 'browsing did not fetch a new puzzle')
  home(); press('Practice'); press('Coordinates')
  check(board.menuPanel.page.title === 'Switch activity?', 'replacing an unfinished puzzle is explicit')
  back(); check(board.menuPanel.page.title === 'Practice', 'Back cancels replacement')
  press('Coordinates'); press('Start coordinates')
  check(board.panel.status.big && board.bar.title === 'Coordinates', 'coordinate round started')
  board._select(board.panel.status.big)
  check(board.panel.status.sub.startsWith('Score 1'), 'trainer scores')
  const target = board.panel.status.big
  press('Menu'); press('Settings'); press('Comfort')
  await sleep(1100)
  check(board.menuPanel.page.title === 'Comfort' && board.panel.status.big === target, 'timer ticks preserve menu and target')
  resume(); check(board.onSquarePick && board.panel.status.sub.startsWith('Score 1'), 'trainer progress survives navigation')
  home(); press('Practice'); press('Puzzle rush'); press('Start rush')
  await until(() => labels().includes('End rush') && board.pieceAt.e4, 'rush puzzle loaded')
  check(labels().includes('Menu'), 'running rush has menu')
  press('Menu'); press('Settings'); press('Advanced'); press('Resolution'); press('Normal'); back()
  check(board.resolution === 'normal' && localStorage.getItem('resolution') === 'normal', 'resolution selected and persisted')
  check(board.menuPanel.page.sub.includes('next time'), 'resolution explains delayed effect')
  press('Frame rate'); press('Show FPS'); back()
  check(board.showFps && localStorage.getItem('showFps') === '1', 'frame rate toggle')
  resume()
  press('End rush'); check(labels().includes('End rush'), 'ending rush requires confirmation')
  press('End rush'); check(labels().includes('New rush'), 'rush explicitly ended')

  home(); press('Settings'); press('Input & audio'); press('Piece interaction'); press('Grab pieces'); back()
  check(board.handMode === 'grab' && $('handmode').value === 'grab', 'piece interaction persisted')
  back(); press('Appearance'); press('Board theme'); press('Green'); back()
  press('Piece set'); press('Ivory'); back()
  check(board.boardTheme === 'green' && board.pieceTheme === 'ivory' && $('boardTheme').value === 'green', 'appearance shared with desktop')
  $('pieceTheme').value = 'neon'; $('pieceTheme').dispatchEvent(new Event('change'))
  check(board.pieceTheme === 'neon' && board.menuPanel.page.actions.find(b => b.label === 'Piece set').detail === 'Neon', 'desktop changes reflected in menu')
  const facingFen = board.fen
  press('Knight facing'); press('Forward'); back()
  check(board.knightFacing === 'forward' && $('knightFacing').value === 'forward' && localStorage.getItem('knightFacing') === 'forward',
    'VR knight preference applies, persists and updates desktop')
  $('knightFacing').value = 'right'; $('knightFacing').dispatchEvent(new Event('change'))
  check(board.knightFacing === 'right' && board.menuPanel.page.actions.find(b => b.label === 'Knight facing').detail === 'Right'
    && localStorage.getItem('knightFacing') === 'right' && board.fen === facingFen, 'desktop knight preference updates menu without changing position')
  $('freeBoard').click()
  check(!board.menuOpen && !board.onSquarePick && board.bar.title === 'Free board', 'free board explicit after finished training')
  press('Reset board'); press('Reset board')

  // Seeking can coexist with training and remains cancellable from every menu.
  home(); press('Play'); press('Online player'); press('Find opponent')
  await until(() => streams['/api/board/seek'] && labels().includes('Cancel seek'), 'seek started')
  home(); press('Practice'); press('Puzzles'); press('Start puzzles')
  await until(() => labels().includes('Hint') && labels().includes('Cancel seek'), 'training while seeking')
  press('Menu'); press('Settings'); press('Comfort')
  const beforeMatchPage = board.menuPanel.page.id
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g2' } })
  await until(() => !board.panel.status.puzzle, 'seek matches under menu')
  check(board.menuPanel.page.id === beforeMatchPage && streams['/api/board/seek'].closed, 'match preserves route and closes seek')
  check(board.menuPanel.page.returnAction.label === 'Return to game', 'return identifies new activity')
  resume(); check(labels().includes('Abort') && !board.onSquarePick, 'matched game controls restored')

  // Finishing one game cannot carry an armed desktop action into the next game.
  $('resign').click()
  check($('resign').textContent === 'Confirm resign', 'first game confirmation armed')
  streams['/api/board/game/stream/g2'].push({ type: 'gameState', moves: '', status: 'aborted', wtime: 6e5, btime: 6e5 })
  await until(() => $('resign').disabled, 'finished game resets desktop resignation')
  check($('resign').textContent === 'Resign', 'finished game clears confirmation label')
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g3' } })
  await until(() => streams['/api/board/game/stream/g3'] && !$('resign').disabled, 'next game attached')
  $('resign').click()
  check(!requests.some(r => r.path === '/api/board/game/g3/resign'), 'new game requires its own confirmation')
  $('resign').click()
  check(requests.filter(r => r.path === '/api/board/game/g3/resign').length === 1, 'new game confirms independently')

  out.textContent = 'APP-OK'
} catch (e) {
  out.textContent = 'APP-FAIL ' + e.message + ' @ ' + (e.stack || '').split('\n').slice(1, 5).join(' | ')
}
</script>
</body>
</html>
