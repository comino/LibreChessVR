<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base href="/">
<title>Parallax app smoke test</title>
<style>body { margin: 0 }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm"
  }
}
</script>
</head>
<body>
<div id="result" style="position:fixed;top:0;right:0;z-index:10;color:#0f0;font-family:monospace"></div>
<script type="module">
// Drives the real index.html UI + main.js against a fake lichess (stubbed fetch).
const out = document.getElementById('result')
const sleep = ms => new Promise(r => setTimeout(r, ms))
const check = (cond, what) => { if (!cond) throw new Error('check failed: ' + what) }
async function until(cond, what, ms = 3000) {
  for (const t0 = performance.now(); performance.now() - t0 < ms; await sleep(20)) if (cond()) return
  throw new Error('timeout: ' + what)
}

// Controllable NDJSON streams keyed by path
const streams = {}, requests = []
function openStream(path, signal) {
  const enc = new TextEncoder()
  let ctl
  const body = new ReadableStream({ start: c => { ctl = c } })
  const s = streams[path] = { closed: false, push: o => ctl.enqueue(enc.encode(JSON.stringify(o) + '\n')) }
  signal?.addEventListener('abort', () => { s.closed = true; ctl.error(new DOMException('aborted', 'AbortError')) })
  return new Response(body)
}
const json = o => new Response(JSON.stringify(o), { headers: { 'content-type': 'application/json' } })
const puzzle = { game: { pgn: 'e4 e5' }, puzzle: { id: 'p1', rating: 1000, solution: ['f1c4'] } }
const full = id => ({ type: 'gameFull', initialFen: 'startpos', white: { id: 'me' }, black: { aiLevel: 2 },
  clock: { initial: 600000, increment: 0 },
  state: { type: 'gameState', moves: '', wtime: 6e5, btime: 6e5, status: 'started' } })
const realFetch = window.fetch
window.fetch = async (url, opts = {}) => {
  if (typeof url !== 'string' || !url.startsWith('https://lichess.org')) return realFetch(url, opts)
  const path = url.replace('https://lichess.org', '')
  requests.push({ path, method: opts.method || 'GET', body: String(opts.body || ''), auth: !!opts.headers?.Authorization })
  if (path === '/api/account') return json({ username: 'me' })
  if (path === '/api/account/playing') return json({ nowPlaying: [] })
  if (path.startsWith('/api/puzzle/next')) return json(puzzle)
  if (path === '/api/challenge/ai') {
    setTimeout(() => streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g1' } }), 10)
    return json({ id: 'g1' })
  }
  if (path.startsWith('/api/board/game/stream/')) {
    const r = openStream(path, opts.signal)
    setTimeout(() => streams[path].push(full()), 10)
    return r
  }
  if (['/api/stream/event', '/api/board/seek'].includes(path)) return openStream(path, opts.signal)
  return json({ ok: true })
}

try {
  const html = await (await realFetch('/index.html')).text()
  const doc = new DOMParser().parseFromString(html, 'text/html')
  const ui = doc.getElementById('ui')
  check(ui, 'index.html has #ui')
  document.body.append(ui)
  localStorage.clear()
  localStorage.setItem('lichessToken', 'tok')
  localStorage.setItem('settings', JSON.stringify({ time: '5', inc: '0', ailevel: '2' }))
  localStorage.setItem('tableHeight', '0.2')
  await import('/src/main.js')
  const board = window.parallax.board, $ = id => document.getElementById(id)
  const labels = () => board.bar.mesh.visible ? board.bar.buttons.map(b => b.label).join() : ''
  const press = label => {
    const b = board.bar.buttons.find(b => b.label === label)
    check(b, `button "${label}" in [${labels()}]`)
    b.run()
  }

  await until(() => labels() === 'Stockfish L2,Maia 5,Seek 5+0,Puzzles,Puzzle rush,Coordinates,Settings', 'idle menu, got ' + labels())
  check(board.panel.status.sub === 'me · 5+0 · random · casual', 'time control on the idle panel: ' + board.panel.status.sub)
  check($('time').value === '5' && $('ailevel').value === '2', 'settings restored into the form')

  // Free board on the idle screen: both sides move by the rules; Reset board returns to the start
  check(board.canPick('e2') && !board.canPick('e7'), 'free board: white to move')
  check(!board.onMove('e2', 'e5'), 'free board refuses illegal moves')
  check(board.onMove('e2', 'e4') && board.pieceAt.e4, 'free board: 1.e4 played')
  check(board.canPick('e7') && !board.canPick('d2'), 'free board: black to move after 1.e4')
  check(labels().includes('Reset board') && labels().endsWith('Settings'), 'reset offered: ' + labels())
  press('Reset board')
  check(board.pieceAt.e2 && !board.pieceAt.e4 && !labels().includes('Reset board') && board.canPick('e2'), 'reset to the start')
  check(board.stage.position.y === 0.2, 'table height restored')
  board.onHeightChange(-0.1)
  check(localStorage.getItem('tableHeight') === '-0.100', 'table height saved')

  $('seek').click()                                  // 2D button still explains why
  check(!requests.some(r => r.path === '/api/board/seek'), 'blitz seek not sent')
  check($('msg').textContent.startsWith('Seeks need rapid'), 'blitz seek explained')

  $('time').value = '10'; $('time').dispatchEvent(new Event('change'))
  check(labels() === 'Stockfish L2,Maia 5,Seek 10+0,Puzzles,Puzzle rush,Coordinates,Settings', 'menu follows settings, got ' + labels())
  check(JSON.parse(localStorage.getItem('settings')).time === '10', 'settings persisted')

  press('Maia 5')
  await until(() => requests.some(r => r.path === '/api/challenge/maia5'), 'maia challenge sent')
  const mc = requests.find(r => r.path === '/api/challenge/maia5')
  check(mc.method === 'POST' && /clock.limit=600/.test(mc.body) && /clock.increment=0/.test(mc.body) && /color=random/.test(mc.body), 'maia params: ' + mc.body)
  check(board.panel.status.text === 'Challenging Maia 5…', 'maia feedback on panel: ' + board.panel.status.text)

  press('Seek 10+0')
  await until(() => streams['/api/board/seek'], 'seek request open')
  check(labels().includes('Cancel seek') && board.panel.status.text === 'Seeking opponent…', 'seeking state')
  press('Cancel seek')
  await until(() => labels().includes('Seek 10+0'), 'seek cancelled, got ' + labels())
  check(streams['/api/board/seek'].closed, 'seek connection closed')

  press('Stockfish L2')
  await until(() => labels() === 'Offer draw,Flip board,Abort', 'game attached, got ' + labels())
  const ai = requests.find(r => r.path === '/api/challenge/ai')
  check(/level=2/.test(ai.body) && /clock.limit=600/.test(ai.body), 'AI challenge params: ' + ai.body)
  check(!board.bar.buttons.some(b => b.label === 'Puzzles'), 'no Puzzles button during a game')

  // While a game runs: replayed/other gameStarts and seeks must not drop it
  const seeksBefore = requests.filter(r => r.path === '/api/board/seek').length
  document.getElementById('seek').click()
  check(requests.filter(r => r.path === '/api/board/seek').length === seeksBefore, '2D seek blocked during game')
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g9', speed: 'rapid' } })
  await sleep(50)
  check(!streams['/api/board/game/stream/g9'] && labels() === 'Offer draw,Flip board,Abort', 'second game did not replace the live one')

  streams['/api/board/game/stream/g1'].push({ type: 'gameState', moves: 'f2f3 e7e5 g2g4 d8h4',
    wtime: 6e5, btime: 6e5, status: 'mate', winner: 'black' })
  await until(() => board.panel.status.text === 'Checkmate — you lose', 'game over text')
  check(labels() === 'Rematch,Review game,Menu', 'compact menu after game, got ' + labels())
  const aiBefore = requests.filter(r => r.path === '/api/challenge/ai').length
  const realPush = streams['/api/stream/event'].push
  press('Rematch')
  await until(() => requests.filter(r => r.path === '/api/challenge/ai').length > aiBefore, 'rematch request')
  const re = requests.filter(r => r.path === '/api/challenge/ai').at(-1)
  check(/level=2/.test(re.body) && /color=black/.test(re.body) && /clock.limit=600/.test(re.body), 'rematch params: ' + re.body)
  streams['/api/stream/event'].push({ type: 'challengeDeclined', challenge: { id: 'x' } })
  await until(() => board.panel.status.text === 'Challenge declined — try another time control or color', 'declined shown, got ' + board.panel.status.text)
  // (the stub also announced g1 again; a finished game with the same id is not re-attached)
  await sleep(50)

  // Settings page: cycle values, persisted, reflected in the menu; table buttons; Back
  press('Menu')
  check(labels().startsWith('Stockfish L2') && labels().endsWith('Settings'), 'Menu leads to the full menu: ' + labels())
  check(board.canPick('a2') && labels().includes('Reset board'), 'after the game the free board continues from its final position')
  press('Settings')
  check(board.panel.status.text === 'Settings' && labels() === 'Look,Play,Puzzles,View,Menu', 'settings hub: ' + labels())
  press('Play')
  check(board.panel.status.text === 'Settings · Play', 'play page')
  check(labels() === 'Stockfish L2,Maia 5,Time 10+0,Color random,Casual,All settings,Menu', 'play page: ' + labels())
  press('Stockfish L2'); press('Maia 5'); press('Time 10+0'); press('Color random'); press('Casual')
  check(labels().startsWith('Stockfish L3,Maia 9,Time 10+5,Color white,Rated'), 'cycled: ' + labels())
  check($('ailevel').value === '3' && $('maia').value === '9' && $('inc').value === '5' && $('color').value === 'white' && $('rated').checked, '2D form updated')
  const saved = JSON.parse(localStorage.getItem('settings'))
  check(saved.ailevel === '3' && saved.maia === '9' && saved.inc === '5' && saved.rated === true, 'persisted: ' + JSON.stringify(saved))
  for (let i = 0; i < 8; i++) press(labels().split(',')[0])        // level wraps 3 -> ... -> 3
  check(labels().startsWith('Stockfish L3'), 'level wraps at 8')
  press('Maia 9'); press('Maia 1')
  check(labels().includes('Maia 5'), 'maia cycles 9 -> 1 -> 5')

  press('All settings'); press('Look')
  check(labels() === 'Scene study,Board walnut,Set antique,Pieces solid,Size 100%,All settings,Menu', 'look page: ' + labels())
  check(board.environment === 'study', 'default scene is study')
  press('Scene study')
  check(board.environment === 'sunset' && localStorage.getItem('environment') === 'sunset' && labels().startsWith('Scene sunset'), 'scene cycled + saved')
  press('Board walnut')
  check(board.boardTheme === 'green' && localStorage.getItem('boardTheme') === 'green', 'board theme cycled + saved')
  check($('boardTheme').value === 'green' && $('scene').value === 'sunset', '2D Look dropdowns follow VR changes')
  $('pieceTheme').value = 'neon'; $('pieceTheme').dispatchEvent(new Event('change'))
  check(board.pieceTheme === 'neon' && localStorage.getItem('pieceTheme') === 'neon' && labels().includes('Set neon'), '2D dropdown sets the piece theme')
  $('pieceTheme').value = 'antique'; $('pieceTheme').dispatchEvent(new Event('change'))
  check(board.tiles.a1.userData.base.getHex() === 0x6f9a52 && board.tiles.a1.material.map, 'green squares with grain')
  check(board.pieceMat.w.map && board.pieceMat.w.normalMap, 'antique set shows the scanned textures')
  press('Set antique')
  check(board.pieceTheme === 'ivory' && !board.pieceMat.w.map && board.pieceMat.w.normalMap, 'colored sets keep the scan relief only')
  press('Set ivory')
  check(board.pieceTheme === 'classic' && localStorage.getItem('pieceTheme') === 'classic', 'piece set cycled + saved')
  check(board.pieceMat.w.color.getHex() === 0xfafafa && board.solidMat.b.color.getHex() === 0x17171a, 'piece materials recolored (incl. picker)')
  press('Pieces solid')
  check(board.pieceStyle === 'ghost' && localStorage.getItem('pieceStyle') === 'ghost', 'piece style cycled + saved')
  press('Pieces ghost'); press('Pieces hidden')
  check(board.pieceStyle === 'solid', 'piece style wraps')
  press('Size 100%')
  check(board.boardScale === 1.25 && board.boardGroup.scale.x === 1.25 && localStorage.getItem('boardScale') === '1.25', 'board scaled + saved')
  press('All settings'); press('View')
  check(labels() === 'Voice off,Table up,Table down,Flip off,Hands point,FPS off,Resolution native,All settings,Menu', 'view page: ' + labels())
  press('Resolution native')
  check(board.resolution === 'normal' && localStorage.getItem('resolution') === 'normal' && labels().includes('Resolution normal'), 'resolution toggled + saved')
  press('Resolution normal')
  check(board.resolution === 'native' && localStorage.getItem('resolution') === 'native', 'resolution back to native')
  press('Voice off')
  check(board.voice === 'opponent' && localStorage.getItem('voice') === 'opponent', 'voice cycled + saved')
  press('Voice opponent'); press('Voice all')
  const h0 = board.stage.position.y
  press('Table up'); press('Table up')
  check(Math.abs(board.stage.position.y - h0 - 0.1) < 1e-9 && localStorage.getItem('tableHeight') === (h0 + 0.1).toFixed(3), 'table up saved')
  check(board.panel.status.sub === `Table +${Math.round((h0 + 0.1) * 100)} cm`, 'height shown: ' + board.panel.status.sub)
  press('Flip off')
  check(board.flipped && Math.abs(board.boardGroup.rotation.y - Math.PI) < 1e-9 && localStorage.getItem('flipped') === '1', 'flipped + saved')
  press('Flip on')
  check(!board.flipped && localStorage.getItem('flipped') === '', 'unflipped')
  press('Hands point')
  check(board.handMode === 'grab' && localStorage.getItem('handMode') === 'grab' && $('handmode').value === 'grab', 'hand mode from VR')
  press('Hands grab')
  check(board.handMode === 'ray', 'hand mode back to point')
  press('FPS off')
  check(board.showFps && localStorage.getItem('showFps') === '1' && board.panel.corner.endsWith('fps'), 'fps readout on: ' + board.panel.corner)
  press('FPS on')
  check(!board.showFps && !board.panel.corner, 'fps readout off')
  press('Menu'); press('Settings')
  check(labels() === 'Look,Play,Puzzles,View,Menu', 'settings reopen on the hub')
  press('Puzzles')
  check(labels() === 'Difficulty normal,Theme mixed,All settings,Menu', 'puzzle page: ' + labels())
  press('Difficulty normal'); press('Theme mixed'); press('Theme mate in 1')
  check(labels().startsWith('Difficulty harder,Theme mate in 2') && $('pdiff').value === 'harder' && $('ptheme').value === 'mateIn2', 'puzzle settings cycled: ' + labels())
  press('Menu')
  check(labels() === 'Stockfish L3,Maia 5,Seek 10+5,Puzzles,Puzzle rush,Coordinates,Reset board,Settings', 'idle menu with new settings (free board still holds the game position): ' + labels())
  streams['/api/stream/event'].push({ type: 'challengeDeclined', challenge: { id: 'y' } })
  await until(() => board.panel.status.text === 'Challenge declined — try another time control or color', 'declined shown on idle panel')
  $('time').value = '10'; $('inc').value = '0'; $('time').dispatchEvent(new Event('change'))

  // Idle: a correspondence game announced by the stream is not attached
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'c1', speed: 'correspondence' } })
  await sleep(50)
  check(!streams['/api/board/game/stream/c1'], 'correspondence game ignored')

  press('Puzzles')
  await until(() => labels() === 'Next puzzle,Flip board,Menu', 'puzzle bar, got ' + labels())
  check(requests.filter(r => r.path.startsWith('/api/puzzle/next')).every(r => !r.auth), 'puzzles fetched anonymously')
  check(requests.some(r => r.path === '/api/puzzle/next?difficulty=harder&angle=mateIn2'), 'puzzle settings used in the fetch')

  press('Menu'); press('Coordinates')                // trainer replaces puzzles
  await until(() => board.panel.status.big, 'trainer target shown')
  check(labels() === 'New round,Menu', 'trainer bar, got ' + labels())
  board._select(board.panel.status.big)
  check(board.panel.status.sub.startsWith('Score 1'), 'trainer scored, got ' + board.panel.status.sub)
  press('Menu')
  check(!board.onSquarePick, 'Menu stops the trainer')
  press('Puzzles')
  await until(() => labels().startsWith('Next puzzle'), 'back to puzzles, got ' + labels())
  check(!board.onSquarePick && !board.panel.status.big, 'trainer unhooked from the board')

  press('Menu'); press('Seek 10+0'); press('Puzzles') // seek while solving puzzles
  await until(() => labels() === 'Next puzzle,Flip board,Cancel seek,Menu', 'cancel seek in puzzle view, got ' + labels())
  check(board.panel.status.puzzle, 'still in puzzle view')
  delete streams['/api/board/game/stream/g2']
  streams['/api/stream/event'].push({ type: 'gameStart', game: { gameId: 'g2' } })
  await until(() => labels() === 'Offer draw,Flip board,Abort', 'seeked game replaces puzzles, got ' + labels())
  check(streams['/api/board/seek'].closed, 'seek closed on game start')
  check(!board.canPick('e7') && board.canPick('e2'), 'game board live, puzzle unbound')
  out.textContent = 'APP-OK'
} catch (e) {
  out.textContent = 'APP-FAIL ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]
}
</script>
</body>
</html>
