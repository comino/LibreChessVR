<!DOCTYPE html><html><head><meta charset="utf-8"><base href="/"><style>body{margin:0} #VRButton{display:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import { Board3D } from './src/board3d.js'
const board = new Board3D(); await board.init()
const [env, cam] = location.hash.slice(1).split(',')
board.setEnvironment(env)
board.setPosition('r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4')
const views = {
  front: [[0, 1.3, 0.35], [0, 1.1, -1.5], 75],
  left: [[0.3, 1.35, 0.3], [-3, 1.3, -1.8], 80],
  right: [[-0.3, 1.35, 0.3], [3, 1.0, -1.6], 80],
  up: [[0, 1.3, 0.3], [0, 4, -3], 85]
}
const [p, t, fov] = views[cam || 'front']
board.camera.fov = fov; board.camera.updateProjectionMatrix()
board.camera.position.set(...p); board.controls.target.set(...t)
let info = 0
setTimeout(() => { board.scene.traverse(o => { if (o.isMesh || o.isPoints || o.isSprite) info++ }); document.title = 'objs ' + info }, 2000)
</script></body></html>
