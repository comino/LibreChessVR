server {
    listen 80;
    listen [::]:80;
    server_name librechessvr.com www.librechessvr.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://librechessvr.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name librechessvr.com;

    ssl_certificate /etc/letsencrypt/live/librechessvr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/librechessvr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/librechessvr-static.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.librechessvr.com;

    ssl_certificate /etc/letsencrypt/live/librechessvr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/librechessvr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=2592000" always;
    return 301 https://librechessvr.com$request_uri;
}
