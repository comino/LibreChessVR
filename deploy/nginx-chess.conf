# Legacy entry point; serve the same local release so old OAuth returns still work.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chess.janasven.de;
    ssl_certificate /etc/letsencrypt/live/chess.janasven.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.janasven.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/librechessvr-static.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name chess.janasven.de;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://chess.janasven.de$request_uri; }
}
