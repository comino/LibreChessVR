# Public address for 3D Chess Practice. Static files remain on fred.
# Install as /etc/nginx/sites-available/chess on janasven, then nginx -t and reload.
server {
    listen 443 ssl;
    server_name chess.janasven.de;

    ssl_certificate /etc/letsencrypt/live/chess.janasven.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.janasven.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://parallax.46-224-133-201.sslip.io;
        proxy_set_header Host parallax.46-224-133-201.sslip.io;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}

server {
    listen 80;
    server_name chess.janasven.de;
    return 301 https://chess.janasven.de$request_uri;
}
