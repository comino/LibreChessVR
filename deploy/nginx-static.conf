# Included at server scope for the deployed LibreChessVR files.
root /var/www/librechessvr/current;
index index.html;
autoindex off;
server_tokens off;

# Compress the public text assets as well as HTML. Keep model/image payloads
# unchanged so bursts of downloads do not spend CPU recompressing binary data.
gzip on;
gzip_comp_level 3;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

add_header Cache-Control "no-cache" always;
add_header Strict-Transport-Security "max-age=2592000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
}

location = /.well-known/assetlinks.json {
    types { }
    default_type application/json;
    try_files $uri =404;
}

# Preserve .well-known while rejecting hidden files elsewhere.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}

location ~* \.(pem|key|bak)(/|$) {
    return 404;
}

location / {
    try_files $uri $uri/ =404;
}
