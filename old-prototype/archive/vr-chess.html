<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Chess - Proof of Concept</title>
  <meta name="description" content="WebXR VR Chess for Meta Quest">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/super-hands@3.0.3/dist/super-hands.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!--
    VR CHESS - WebXR Chess Game for Meta Quest

    SETUP:
    1. Ensure chess.glb is in the same directory as this HTML file
    2. Run a local web server (e.g., python -m http.server 8000)
    3. Access on Meta Quest Browser or via network

    HOW TO USE:

    VR Mode (Meta Quest):
    1. Open this page in Meta Quest Browser
    2. Click the VR goggles icon (bottom right) to enter VR mode
    3. Use grip button on controllers to grab and move pieces
    4. Click the red RESET button to return to starting viewpoint

    Desktop Preview Mode:
    1. Open in any modern browser to view the board
    2. Use mouse to look around
    3. WASD keys to move around the board
    4. Note: Piece interaction requires VR mode

    FEATURES:
    - Complete chess set with all 32 pieces
    - Realistic 3D models (chess.glb)
    - VR controller support with grab interaction
    - White pieces (bright) and black pieces (medium gray)
    - Standard chess starting positions
    - Black void environment
  -->

  <a-scene background="color: #000000" shadow="type: basic">

    <!-- Assets - Load 3D models -->
    <a-assets>
      <a-asset-item id="chessPieces" src="chess.glb"></a-asset-item>
    </a-assets>

    <!-- Camera Rig (Player) - Seated position at white's side -->
    <a-entity id="cameraRig" position="0 0.9 1.5">
      <a-camera id="mainCamera" look-controls wasd-controls="enabled: true"></a-camera>

      <!-- Left Controller -->
      <a-entity
        id="leftHand"
        hand-controls="hand: left; handModelStyle: lowPoly; color: #15ACCF"
        laser-controls
        super-hands="colliderEvent: raycaster-intersection;
                     colliderEventProperty: els;
                     colliderEndEvent: raycaster-intersection-cleared;
                     colliderEndEventProperty: clearedEls;">
      </a-entity>

      <!-- Right Controller -->
      <a-entity
        id="rightHand"
        hand-controls="hand: right; handModelStyle: lowPoly; color: #15ACCF"
        laser-controls
        super-hands="colliderEvent: raycaster-intersection;
                     colliderEventProperty: els;
                     colliderEndEvent: raycaster-intersection-cleared;
                     colliderEndEventProperty: clearedEls;">
      </a-entity>
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #888; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="2 4 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.3" position="-2 4 -2"></a-entity>

    <!-- Chess Board Container -->
    <a-entity id="chessBoard" position="0 0.85 0">

      <!-- Board Base -->
      <a-box
        id="boardBase"
        position="0 -0.05 0"
        width="2.4"
        height="0.1"
        depth="2.4"
        color="#2d2d2d"
        shadow="receive: true">
      </a-box>

      <!-- Chess Squares (8x8 grid) -->
      <!-- Row 1 (a-h, rank 1) -->
      <a-box position="-1.05 0 1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.15 0 1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.45 0 1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.75 0 1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="1.05 0 1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>

      <!-- Row 2 -->
      <a-box position="-1.05 0 0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.15 0 0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.45 0 0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.75 0 0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="1.05 0 0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>

      <!-- Row 3 -->
      <a-box position="-1.05 0 0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.15 0 0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.45 0 0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.75 0 0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="1.05 0 0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>

      <!-- Row 4 -->
      <a-box position="-1.05 0 0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.15 0 0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.45 0 0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.75 0 0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="1.05 0 0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>

      <!-- Row 5 -->
      <a-box position="-1.05 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.15 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.45 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.75 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="1.05 0 -0.15" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>

      <!-- Row 6 -->
      <a-box position="-1.05 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.15 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.45 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.75 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="1.05 0 -0.45" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>

      <!-- Row 7 -->
      <a-box position="-1.05 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.15 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.45 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.75 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="1.05 0 -0.75" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>

      <!-- Row 8 -->
      <a-box position="-1.05 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.75 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="-0.45 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="-0.15 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.15 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="0.45 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>
      <a-box position="0.75 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box>
      <a-box position="1.05 0 -1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box>

      <!-- Hidden template model - loaded but not visible -->
      <a-entity
        id="chessPiecesTemplate"
        gltf-model="#chessPieces"
        visible="false">
      </a-entity>

      <!-- Chess pieces will be dynamically created here by JavaScript -->

    </a-entity>

    <!-- Reset Position Button -->
    <a-box
      id="resetButton"
      position="-1.8 1.2 0"
      width="0.3"
      height="0.15"
      depth="0.1"
      color="#FF3333"
      shadow="cast: true">
      <a-text
        value="RESET"
        align="center"
        position="0 0 0.055"
        scale="0.4 0.4 0.4"
        color="#FFFFFF">
      </a-text>
    </a-box>

  </a-scene>

  <script>
    // ============================================
    // EASY TUNING PARAMETERS - ADJUST THESE!
    // ============================================
    const PIECE_SCALE = 0.003;           // Very small scale
    const PIECE_HEIGHT = 0.00;           // Raise pieces above board
    const POSITION_OFFSET = {x: 0, y: 0, z: 0}; // No offset - pieces auto-centered now
    // ============================================

    const pieceTemplates = {};

    // Map model nodes to chess piece types
    const nodeMapping = {
      'Pawn': 'pawn',
      'Queen': 'queen',
      'King': 'king',
      'Rook': 'rook',
      'Knight': 'knight',
      'Bishop': 'bishop'
    };

    // Chess starting positions
    const pieceLayout = [
      // White pieces (rank 1 and 2)
      {type: 'rook', color: 'white', pos: [-1.05, 0.01, 1.05]},
      {type: 'knight', color: 'white', pos: [-0.75, 0.01, 1.05]},
      {type: 'bishop', color: 'white', pos: [-0.45, 0.01, 1.05]},
      {type: 'queen', color: 'white', pos: [-0.15, 0.01, 1.05]},
      {type: 'king', color: 'white', pos: [0.15, 0.01, 1.05]},
      {type: 'bishop', color: 'white', pos: [0.45, 0.01, 1.05]},
      {type: 'knight', color: 'white', pos: [0.75, 0.01, 1.05]},
      {type: 'rook', color: 'white', pos: [1.05, 0.01, 1.05]},
      {type: 'pawn', color: 'white', pos: [-1.05, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [-0.75, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [-0.45, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [-0.15, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [0.15, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [0.45, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [0.75, 0.01, 0.75]},
      {type: 'pawn', color: 'white', pos: [1.05, 0.01, 0.75]},
      // Black pieces (rank 8 and 7)
      {type: 'rook', color: 'black', pos: [-1.05, 0.01, -1.05]},
      {type: 'knight', color: 'black', pos: [-0.75, 0.01, -1.05]},
      {type: 'bishop', color: 'black', pos: [-0.45, 0.01, -1.05]},
      {type: 'queen', color: 'black', pos: [-0.15, 0.01, -1.05]},
      {type: 'king', color: 'black', pos: [0.15, 0.01, -1.05]},
      {type: 'bishop', color: 'black', pos: [0.45, 0.01, -1.05]},
      {type: 'knight', color: 'black', pos: [0.75, 0.01, -1.05]},
      {type: 'rook', color: 'black', pos: [1.05, 0.01, -1.05]},
      {type: 'pawn', color: 'black', pos: [-1.05, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [-0.75, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [-0.45, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [-0.15, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [0.15, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [0.45, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [0.75, 0.01, -0.75]},
      {type: 'pawn', color: 'black', pos: [1.05, 0.01, -0.75]}
    ];

    document.querySelector('a-scene').addEventListener('loaded', function() {
      const template = document.getElementById('chessPiecesTemplate');
      const chessBoard = document.getElementById('chessBoard');

      template.addEventListener('model-loaded', function() {
        const model = template.getObject3D('mesh');
        if (!model) return;

        // Extract piece templates from the loaded model
        model.traverse(function(node) {
          if (node.name && nodeMapping[node.name]) {
            const pieceType = nodeMapping[node.name];
            pieceTemplates[pieceType] = node.clone();
          }
        });

        // Create all 32 chess pieces
        pieceLayout.forEach((piece, index) => {
          if (!pieceTemplates[piece.type]) {
            return;
          }

          // Create entity for this piece
          const pieceEntity = document.createElement('a-entity');
          pieceEntity.setAttribute('class', 'chess-piece ' + piece.color + '-' + piece.type);
          pieceEntity.setAttribute('position', {
            x: piece.pos[0] + POSITION_OFFSET.x,
            y: PIECE_HEIGHT,
            z: piece.pos[2] + POSITION_OFFSET.z
          });
          pieceEntity.setAttribute('scale', {
            x: PIECE_SCALE,
            y: PIECE_SCALE,
            z: PIECE_SCALE
          });
          pieceEntity.setAttribute('shadow', 'cast: true');

          // Make it grabbable in VR
          pieceEntity.setAttribute('hoverable', '');
          pieceEntity.setAttribute('grabbable', '');
          pieceEntity.setAttribute('stretchable', '');
          pieceEntity.setAttribute('draggable', '');
          pieceEntity.setAttribute('droppable', '');

          // Clone the 3D model
          const clonedPiece = pieceTemplates[piece.type].clone();

          // Apply colors to pieces
          clonedPiece.traverse(function(child) {
            if (child.isMesh) {
              const meshName = child.name || '';

              if (meshName.includes('Plastic')) {
                child.visible = true;

                if (child.material) {
                  const mat = child.material.clone();
                  if (piece.color === 'white') {
                    mat.color.set(0xFFFFFF);
                    mat.emissive.set(0xAAAAAA);
                  } else {
                    mat.color.set(0x666666);
                    mat.emissive.set(0x222222);
                  }
                  mat.needsUpdate = true;
                  child.material = mat;
                }
              } else {
                child.visible = false;
              }
            }
          });

          // Center piece horizontally, align base to ground
          const bbox = new THREE.Box3().setFromObject(clonedPiece);
          const center = new THREE.Vector3();
          bbox.getCenter(center);

          clonedPiece.position.x -= center.x;
          clonedPiece.position.z -= center.z;
          clonedPiece.position.y -= bbox.min.y;

          // Add the cloned piece when entity is ready
          pieceEntity.addEventListener('loaded', function() {
            const obj = pieceEntity.object3D;
            obj.add(clonedPiece);
          });

          chessBoard.appendChild(pieceEntity);
        });
      });

      template.addEventListener('model-error', function(e) {
        console.error('Error loading chess model:', e);
      });

      // Reset button functionality
      const resetButton = document.getElementById('resetButton');
      const cameraRig = document.getElementById('cameraRig');

      resetButton.addEventListener('click', function() {
        cameraRig.setAttribute('position', '0 0.9 1.5');
        cameraRig.setAttribute('rotation', '0 0 0');
      });

      resetButton.classList.add('clickable');
    });
  </script>

</body>
</html>
