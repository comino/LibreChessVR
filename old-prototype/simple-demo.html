<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chess Frontend - Simple API Demo</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/super-hands@3.0.3/dist/super-hands.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      padding: 15px;
      border-radius: 5px;
      z-index: 1000;
      max-width: 400px;
    }
    button {
      background: #333;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 8px 15px;
      margin: 3px;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover { background: #444; }
    input {
      background: #222;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 5px;
      font-family: monospace;
      width: 100%;
      margin: 5px 0;
    }
    #fen { font-size: 11px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="controls">
    <h3 style="margin-top:0">Simple Chess Frontend API</h3>
    <div>
      <strong>Current FEN:</strong>
      <div id="fen"></div>
    </div>
    <div style="margin-top: 10px">
      <button onclick="app.reset()">Reset</button>
      <button onclick="app.undo()">Undo</button>
    </div>
    <div style="margin-top: 10px">
      <strong>Load Position:</strong>
      <input id="fenInput" placeholder="Enter FEN string">
      <button onclick="loadCustomFen()">Load</button>
    </div>
    <div style="margin-top: 10px">
      <button onclick="loadScholarsMate()">Scholar's Mate</button>
      <button onclick="loadEndgame()">Endgame</button>
      <button onclick="testKingPosition()">Test King Position</button>
    </div>
    <div style="margin-top: 10px">
      <button onclick="app.rotateBoard()">Rotate Board</button>
      <button onclick="app.setView('white')">White View</button>
      <button onclick="app.setView('black')">Black View</button>
    </div>
    <div id="status" style="margin-top: 10px; color: #ff0;"></div>
    <div style="margin-top: 5px; font-size: 10px; color: #666;">
      Hard refresh: Ctrl+Shift+R (Win) / Cmd+Shift+R (Mac)
    </div>
  </div>

  <a-scene background="color: #000000" shadow="type: basic">
    <a-assets>
      <a-asset-item id="chessPieces" src="chess.glb"></a-asset-item>
    </a-assets>

    <a-entity id="cameraRig" position="0 0.9 1.5">
      <a-camera look-controls wasd-controls="enabled: true"></a-camera>

      <a-entity
        id="leftHand"
        hand-controls="hand: left; handModelStyle: lowPoly; color: #15ACCF"
        laser-controls
        super-hands="colliderEvent: raycaster-intersection;
                     colliderEventProperty: els;
                     colliderEndEvent: raycaster-intersection-cleared;
                     colliderEndEventProperty: clearedEls;">
      </a-entity>

      <a-entity
        id="rightHand"
        hand-controls="hand: right; handModelStyle: lowPoly; color: #15ACCF"
        laser-controls
        super-hands="colliderEvent: raycaster-intersection;
                     colliderEventProperty: els;
                     colliderEndEvent: raycaster-intersection-cleared;
                     colliderEndEventProperty: clearedEls;">
      </a-entity>
    </a-entity>

    <a-entity light="type: ambient; color: #888; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="2 4 2"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.3" position="-2 4 -2"></a-entity>

    <a-entity id="chessBoard" position="0 0.85 0">
      <a-box position="0 -0.05 0" width="2.4" height="0.1" depth="2.4" color="#2d2d2d" shadow="receive: true"></a-box>

      <!-- Rank 8 (z=1.05) -->

      <a-box position="-0.75 0 1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box><!-- g8 LIGHT -->
      <a-box position="-0.45 0 1.05" width="0.3" height="0.02" depth="0.3" color="#B58863" shadow="receive: true"></a-box><!-- f8 DARK -->

      <a-box position="1.05 0 1.05" width="0.3" height="0.02" depth="0.3" color="#F0D9B5" shadow="receive: true"></a-box><!-- a8 LIGHT -->
      <!-- Rank 7 (z=0.75) -->

      <a-entity id="chessPiecesTemplate" gltf-model="#chessPieces" visible="false"></a-entity>

  <script type="module">
    import { MyChessApp } from './example-app.js'

    const sceneEl = document.querySelector('a-scene')
    let app

    sceneEl.addEventListener('loaded', async function() {
      // Initialize your app
      app = new MyChessApp(sceneEl)
      await app.init()

      // Expose to window for buttons
      window.app = app

      // Update UI
      updateUI()

      console.log('App ready')
      console.log('Try: app.loadPosition(fen)')
      console.log('Try: app.getCurrentPosition()')
    })

    function updateUI() {
      document.getElementById('fen').textContent = app.getCurrentPosition()
    }

    window.loadCustomFen = function() {
      const fen = document.getElementById('fenInput').value.trim()
      if (fen) {
        try {
          app.loadPosition(fen)
          updateUI()
          document.getElementById('status').textContent = 'Position loaded'
          setTimeout(() => document.getElementById('status').textContent = '', 2000)
        } catch (e) {
          document.getElementById('status').textContent = 'Invalid FEN: ' + e.message
        }
      }
    }

    window.loadScholarsMate = function() {
      app.loadPosition('r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 0 4')
      updateUI()
    }

    window.loadEndgame = function() {
      app.loadPosition('8/8/4k3/8/8/4K3/4Q3/8 w - - 0 1')
      updateUI()
    }

    window.testKingPosition = function() {
      // White King only on e1
      app.loadPosition('4K3/8/8/8/8/8/8/8 w - - 0 1')
      updateUI()
      console.log('White King should be at e1 (0.15, 0, -1.05)')
      console.log('Mapper says e1 is at:', app.frontend.mapper.squareToPosition('e1'))
    }

    // Override app methods to update UI
    const originalReset = app?.reset
    const originalUndo = app?.undo

    if (app) {
      app.reset = function() {
        originalReset.call(this)
        updateUI()
      }

      app.undo = function() {
        originalUndo.call(this)
        updateUI()
      }
    }
  </script>
</body>
</html>
